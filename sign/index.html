<!doctype html>
<html lang="en">
<head>

<title>Sign agreement · Haritt Developers</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#F7F6F3;--line:#E4E1DA;--line2:#CFCBC2;--txt:#1b1b1f;--mut:#5d5d68;--dim:#8a8a94;--acc:#E8461F;--red:#8B0D0D;--ok:#1B9E63;--bad:#C62828}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 Inter,"Noto Sans Devanagari",system-ui,sans-serif;min-height:100vh}
html[lang=hi] .L-en{display:none}html[lang=en] .L-hi{display:none}
.wrap{max-width:780px;margin:0 auto;padding:0 18px 56px}
header{display:flex;align-items:center;gap:12px;padding:16px 0 14px;border-bottom:2px solid var(--acc);margin-bottom:22px}
header img{width:42px;height:42px;border-radius:50%;display:block}
.brand{font:700 13px/1.2 Montserrat,Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.brand small{display:block;font:500 12px/1.4 Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--mut);margin-top:3px}
.lang{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:99px;overflow:hidden;flex:none}
.lang button{background:#fff;border:0;color:var(--mut);font:600 13.5px Inter,"Noto Sans Devanagari",sans-serif;padding:8px 14px;cursor:pointer}
.lang button.on{background:var(--acc);color:#fff}
.card{margin:0 0 26px}
.card.top{margin-bottom:22px}
.eyebrow{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:26px;line-height:1.25;margin:6px 0 10px;font-weight:700}
h2{font-size:17px;margin:0 0 8px;font-weight:700;color:var(--red)}
p{margin:0 0 10px;color:var(--mut)}
.steps{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--txt);font-size:15px}
.steps b{color:var(--acc);width:18px;flex:none}
label{display:block;font-size:13.5px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.sl{color:var(--dim);font-size:13px;font-weight:400;margin-left:6px}
input,textarea{width:100%;background:#fff;color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(232,70,31,.14)}
input[readonly]{background:var(--soft);color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grp{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.grp h3{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:12px 0 0}
.paper{background:#fff;color:#1b1b1f;border:1px solid var(--line);border-radius:6px;padding:26px 22px;font:15px/1.7 Inter,"Noto Sans Devanagari",sans-serif}
.paper .t{text-align:center;font-weight:700;font-size:16.5px;letter-spacing:.02em;margin:0 0 2px}
.paper .s{text-align:center;color:#555;font-size:13px;margin:0 0 16px;padding-bottom:14px;border-bottom:2px solid var(--acc)}
.paper h4{font-size:15px;margin:20px 0 6px;color:var(--red)}
.paper p{color:#1b1b1f;margin:0 0 8px}
.paper .c{display:flex;gap:8px;margin:0 0 8px}.paper .c span.n{flex:none;width:30px;color:#777}
.paper .c div{flex:1}
.ph{background:#FFF1E8;border-bottom:2px solid var(--acc);padding:0 3px;border-radius:3px}
.ph.e{color:#B25A33}
.paper .v{background:#EAF6EF;border-bottom:2px solid #2FA36B;padding:0 3px;border-radius:3px}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 10px}
.link{background:none;border:0;color:var(--acc);font:600 14px Inter,"Noto Sans Devanagari",sans-serif;cursor:pointer;padding:6px 0}
.pad{background:#fff;border-radius:12px;border:2px dashed var(--line2);position:relative;touch-action:none}
.pad canvas{width:100%;height:170px;display:block;border-radius:10px;touch-action:none;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9a9aa5;font-size:15px;pointer-events:none;text-align:center;padding:0 12px}
.pad.has .hint{display:none}
.pad .baseline{position:absolute;left:18px;right:18px;bottom:38px;border-top:1px solid #d6d6dd;pointer-events:none}
.chk{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;padding:14px;border:1px solid var(--line2);border-radius:12px;background:var(--soft);cursor:pointer;font-weight:400}
.chk input{width:22px;height:22px;flex:none;margin:2px 0 0;accent-color:#E8461F}
.chk span{font-size:14.5px;color:var(--txt)}
.btn{display:block;width:100%;border:0;border-radius:99px;background:var(--acc);color:#fff;font:700 17px Inter,"Noto Sans Devanagari",sans-serif;padding:15px 22px;margin-top:18px;cursor:pointer;text-align:center;text-decoration:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--txt);font-weight:600;font-size:15px;padding:12px 18px;margin-top:10px}
.btn.sm{display:inline-block;width:auto;font-size:14px;padding:10px 18px;margin:0}
.err{color:var(--bad);font-size:14px;margin:12px 0 0;min-height:1px}
.pill{white-space:nowrap;flex:none;display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.ok{background:#E3F5EC;color:var(--ok)}.pill.wait{background:#FFF0E3;color:#C2570F}
.party{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.party:first-of-type{border-top:0}
.party .nm{font-weight:600}.party .sub{color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.big{width:60px;height:60px;border-radius:50%;background:#E3F5EC;display:flex;align-items:center;justify-content:center;margin:0 0 14px}
.big svg{width:28px;height:28px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:70px auto}
@keyframes s{to{transform:rotate(360deg)}}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;color:var(--mut);font-size:14px;margin:0 0 12px}
.codebox{letter-spacing:.5em;font-size:28px;font-weight:700;text-align:center;padding:14px 10px 14px 20px}
.foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.on{opacity:1}
@media(max-width:560px){.brand{letter-spacing:.08em;font-size:12px}.row{grid-template-columns:1fr}h1{font-size:23px}.brand small{display:none}.lang button{padding:8px 11px}.paper{padding:20px 16px}}
</style>
</head>

const API="https://script.google.com/macros/s/AKfycbxlnGmdBPvi9BsWG7nxAIY9qWOF2yNGivhxrtj1OSRZ7CZFHkhLCwRcgsUftN_l-c4b/exec";
const CONTENT=[{"k": "p", "t": "Date: **{{date}}**     Place: **{{place}}**"}, {"k": "h", "t": "Who is making this agreement"}, {"k": "cl", "n": "1.", "t": "**Owner:** {{owner_name}}, {{owner_parent}}, living at {{owner_addr}}. Mobile: {{owner_mobile}}. Email: {{owner_email}}. (“Owner”)"}, {"k": "cl", "n": "2.", "t": "**Haritt Developers:** a venture of **Haritt Group**. It is a business that is not yet registered. Its main working address is Behind Shiva Talkies, Sahyog Nagar, Bharatpur, Rajasthan 321001. Email: developers@haritt.com. It is run by its founders **{{f1_name}}** and **{{f2_name}}**. (“Haritt”)"}, {"k": "h", "t": "The flat"}, {"k": "p", "t": "The Owner owns this flat: **{{flat_addr}}**. (“Flat”)"}, {"k": "h", "t": "1. What the Owner allows"}, {"k": "cl", "n": "1.1", "t": "Haritt can use the address of the Flat as its **mailing (correspondence) address** on its website, emails, bills, quotes and contracts, and as its **Jaipur address for correspondence and client meetings**."}, {"k": "cl", "n": "1.2", "t": "Haritt can receive letters and courier at the Flat."}, {"k": "cl", "n": "1.3", "t": "Haritt can say on its website and profiles: **“Jaipur address (correspondence and meetings): {{flat_addr}}. Client meetings by prior appointment only.”** It can also say it **serves clients in Jaipur and Rajasthan**."}, {"k": "cl", "n": "1.4", "t": "Haritt can hold **a few meetings** at the Flat, with its clients and business partners, only when the Owner agrees in advance (see point 3)."}, {"k": "cl", "n": "1.5", "t": "**Google Business Profile.** Haritt can create and manage a Google Business Profile (and similar listings) for this address, showing it as an address for **appointment-only meetings**. If Google asks for proof such as a postcard, code or phone call, the Owner will help in a reasonable way. He does not have to show private parts of his home."}, {"k": "h", "t": "2. What Haritt will not do"}, {"k": "cl", "n": "2.1", "t": "It will **not** say the Flat has staff, open hours, or a shop or showroom. It will not call it a branch, head office or registered office. It will always say meetings are **by appointment only**."}, {"k": "cl", "n": "2.2", "t": "It will **not** keep staff, stock, equipment or files at the Flat. It will not put up any board or sign. There will be no walk-in visitors, events, sales or cash dealings."}, {"k": "cl", "n": "2.3", "t": "It will **not** use this address for GST, Udyam, company registration, or bank or payment account forms. If this is needed later, the Owner must agree separately in writing."}, {"k": "cl", "n": "2.4", "t": "It will not put the Owner’s name, photo or personal details on the website or anywhere public. It will not upload photos of the Flat’s inside."}, {"k": "cl", "n": "2.5", "t": "Haritt will follow Google’s rules for its listing. If Google suspends or removes the listing, that is Haritt’s problem only. If the listing causes trouble (for example people coming without appointment, or a society complaint), the Owner can ask Haritt to remove it with **15 days’ notice** and Haritt will do so within 7 days. The other permissions continue."}, {"k": "cl", "n": "2.6", "t": "Other Haritt Group ventures will not use this address unless the Owner agrees in writing (see 9.2)."}, {"k": "h", "t": "3. Meetings at the Flat"}, {"k": "cl", "n": "3.1", "t": "Haritt will ask in advance by WhatsApp or email, **at least 2 days before**. It will say the date, time, purpose and names of people coming."}, {"k": "cl", "n": "3.2", "t": "The Owner will reply within 1 day. The Owner can say no only for a fair reason, such as: he is not free, family or health reason, repair work, society rule, safety, or a visitor not told in advance. He will give the reason and offer another day within 7 days."}, {"k": "cl", "n": "3.3", "t": "Limits: up to **4 meetings a month** (can be increased by a written message from the Owner), each up to **2 hours**, between **10 am and 6 pm**, with up to **4 people**."}, {"k": "cl", "n": "3.4", "t": "Haritt’s clients and business partners can come, but only if their names are told in advance, and a founder must come with them. Haritt is responsible for how its visitors behave, and will follow society rules."}, {"k": "h", "t": "4. Letters and courier"}, {"k": "cl", "n": "4.1", "t": "The Owner will keep Haritt’s letters and parcels safely when he is at home. He can refuse cash-on-delivery, valuable, heavy or suspicious items."}, {"k": "cl", "n": "4.2", "t": "If a government, tax, bank or court letter comes, the Owner will tell Haritt **within 2 working days** and will not open it. Haritt will collect it within 7 days."}, {"k": "cl", "n": "4.3", "t": "The Owner is not responsible if a letter is lost, unless he was very careless. He is not Haritt’s agent for receiving legal notices."}, {"k": "cl", "n": "4.4", "t": "Haritt pays all courier and return costs."}, {"k": "h", "t": "5. What this agreement is not"}, {"k": "cl", "n": "5.1", "t": "It is **not** a rent agreement, lease or tenancy. Haritt gets **no right to live in, hold or own** any part of the Flat. The Owner keeps full control and can sell or rent the Flat."}, {"k": "cl", "n": "5.2", "t": "It does not make the Owner a partner, employer or guarantor of Haritt. The Owner is **not responsible** for Haritt’s business, debts, taxes or contracts."}, {"k": "cl", "n": "5.3", "t": "**No money** is to be paid by either side. Haritt pays its own costs. The Owner pays the Flat’s society, tax and electricity bills as usual. If money is ever agreed, it must be written and signed by both."}, {"k": "h", "t": "6. Responsibility"}, {"k": "cl", "n": "6.1", "t": "Haritt is responsible for its business, its mail contents, and its visitors. If Haritt or its visitors damage anything in the Flat, Haritt will pay for it. If anyone makes a claim against the Owner because of Haritt’s business or this address, Haritt will handle it and cover the cost, unless it was caused by the Owner’s own fault."}, {"k": "cl", "n": "6.2", "t": "The Owner promises that: he is the owner (or all owners agree); no bank, landlord or builder rule stops this; and he has checked that his society does not forbid receiving letters, occasional client meetings and a Google listing for this address. If this is untrue and Haritt has to change its records, the Owner will pay the reasonable cost up to ₹{{cap}}."}, {"k": "cl", "n": "6.3", "t": "The Owner will tell Haritt **within 7 days** if his society, a rule, a notice, a sale, a mortgage or a plan to leave the Flat can affect this agreement. If a rule or order makes one thing not allowed, only that thing stops. The rest continues."}, {"k": "h", "t": "7. Privacy"}, {"k": "cl", "n": "7.1", "t": "Each side will keep the other’s private information private. Haritt will keep copies of the Owner’s ID safe, use them only for this agreement, and delete them within 30 days after it ends. The Owner will not open Haritt’s mail unless it is needed for safety or law."}, {"k": "h", "t": "8. How long it lasts and how to end it"}, {"k": "cl", "n": "8.1", "t": "It starts on the date above and runs for **12 months**. It then continues each year unless someone gives 30 days’ notice not to continue."}, {"k": "cl", "n": "8.2", "t": "In the first 12 months, **Haritt** can end it at any time with **15 days’ notice**. The **Owner** can end it only for these reasons: Haritt breaks this agreement and does not fix it within 7 days; a society or legal rule makes it not possible; the Flat is sold or he must leave it; Haritt closes its business; or the Owner dies or cannot act (his family can then end it with 30 days’ notice)."}, {"k": "cl", "n": "8.3", "t": "After 12 months, either side can end it for any reason with **30 days’ written notice**. WhatsApp or email is fine."}, {"k": "cl", "n": "8.4", "t": "During the notice period everything stays as agreed. Meetings already confirmed stay unless there is an emergency."}, {"k": "cl", "n": "8.5", "t": "Within the notice period Haritt will remove the address from its website, **Google listing**, profiles and papers, and tell the Owner in writing. The Owner will keep accepting letters for **60 days after the end date**, then may return them to the sender."}, {"k": "cl", "n": "8.6", "t": "If the Owner asks, or Haritt asks, the Owner will give a short letter confirming that Haritt used the address with his permission during this period."}, {"k": "h", "t": "9. Keeping a clear record"}, {"k": "cl", "n": "9.1", "t": "Only this agreement and later written messages (WhatsApp or email from the numbers below) count as permission. Spoken promises do not count."}, {"k": "cl", "n": "9.2", "t": "What is written in this agreement cannot be denied later by either side. Any new permission must be written, for example: “Yes, you can do this on this date.”"}, {"k": "cl", "n": "9.3", "t": "Contact for messages. Owner: {{owner_mobile}}, {{owner_email}}. Haritt: developers@haritt.com, {{haritt_mobile}}."}, {"k": "h", "t": "10. Problems"}, {"k": "cl", "n": "10.1", "t": "If there is a disagreement, first talk within 7 days and try to fix it in 15 days. If not fixed, try a neutral mediator. If still not fixed, the courts in Jaipur, Rajasthan will decide. Indian law applies."}, {"k": "h", "t": "11. Other points"}, {"k": "cl", "n": "11.1", "t": "Haritt is not registered, so the **founders also sign personally** and are responsible for Haritt’s promises here. If Haritt registers later, it will tell the Owner within 15 days and both will sign a short note moving this agreement to the registered business."}, {"k": "cl", "n": "11.2", "t": "Neither side can pass this agreement to anyone else. Changes must be written and signed by both, except new permissions under 9.2."}, {"k": "cl", "n": "11.3", "t": "This is the full agreement on this subject. Both sides have read it, understood it, and sign by free choice. Haritt pays the stamp paper cost."}];
const CONTENT_HI=["तारीख: **{{date}}**     स्थान: **{{place}}**", "यह एग्रीमेंट कौन कर रहा है", "**मालिक:** {{owner_name}}, {{owner_parent}}, निवासी {{owner_addr}}. मोबाइल: {{owner_mobile}}. ईमेल: {{owner_email}}. (“मालिक”)", "**Haritt Developers:** **Haritt Group** की एक venture. यह एक ऐसा बिज़नेस है जो अभी रजिस्टर्ड नहीं है. इसका मुख्य काम का पता है: Behind Shiva Talkies, Sahyog Nagar, Bharatpur, Rajasthan 321001. ईमेल: developers@haritt.com. इसे इसके founders **{{f1_name}}** और **{{f2_name}}** चलाते हैं. (“Haritt”)", "फ्लैट", "मालिक इस फ्लैट का मालिक है: **{{flat_addr}}**. (“फ्लैट”)", "1. मालिक क्या इजाज़त देता है", "Haritt फ्लैट के पते को अपनी वेबसाइट, ईमेल, बिल, quotation और contract पर **मेलिंग (पत्राचार) पते** के रूप में, और **जयपुर में पत्राचार व ग्राहकों से मीटिंग के पते** के रूप में इस्तेमाल कर सकता है.", "Haritt फ्लैट पर चिट्ठियाँ और courier ले सकता है.", "Haritt अपनी वेबसाइट और profiles पर यह लिख सकता है: **“जयपुर का पता (पत्राचार और मीटिंग): {{flat_addr}}. ग्राहक मीटिंग सिर्फ़ पहले से appointment लेकर.”** वह यह भी लिख सकता है कि वह **जयपुर और राजस्थान में ग्राहकों की सेवा करता है**.", "Haritt अपने ग्राहकों और business partners के साथ फ्लैट पर **कुछ मीटिंग** कर सकता है, लेकिन सिर्फ़ तब जब मालिक पहले से हाँ कहे (बिंदु 3 देखें).", "**Google Business Profile.** Haritt इस पते के लिए Google Business Profile (और ऐसी ही listings) बना और चला सकता है, जिसमें इसे **सिर्फ़ appointment वाली मीटिंग** के पते के रूप में दिखाया जाएगा. अगर Google कोई सबूत माँगे, जैसे postcard, code या phone call, तो मालिक ठीक तरह से मदद करेगा. उसे अपने घर के निजी हिस्से दिखाने की ज़रूरत नहीं है.", "2. Haritt क्या नहीं करेगा", "वह यह **नहीं** कहेगा कि फ्लैट पर staff, खुलने का समय, या दुकान या showroom है. वह इसे branch, head office या registered office नहीं कहेगा. वह हमेशा लिखेगा कि मीटिंग **सिर्फ़ appointment पर** होती है.", "वह फ्लैट पर staff, माल, सामान या फ़ाइलें **नहीं** रखेगा. कोई बोर्ड या साइन नहीं लगाएगा. बिना बताए आने वाले visitors, कार्यक्रम, बिक्री या नकद लेन-देन नहीं होगा.", " const fmtTime=d=>new Date(d).toLocaleString("en-GB",{...IST,day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).replace(/\bam\b/,"AM").replace(/\bpm\b/,"PM")+" IST";

function values(over){
  const o=(S&&S.parties.owner)||{},od=o.data||{},f1=(S&&S.parties.f1)||{},f2=(S&&S.parties.f2)||{};
  const done=S&&S.complete;const last=done?Object.values(S.parties).map(p=>p.signedAt).sort().pop():null;
  const v={date:fmtDate(last||Date.now()),place:od.place||"Jaipur",owner_name:o.name||"",owner_parent:od.parent||"",owner_addr:od.addr||"",owner_mobile:od.mobile||"",owner_email:o.email||"",
    f1_name:f1.name||"",f2_name:f2.name||"",flat_addr:od.flat_addr||"",cap:(S&&S.cap)||"",haritt_mobile:(S&&S.mob)||""};

const LABEL={en:{owner_name:"Owner full name",owner_parent:"son/daughter of ...",owner_addr:"Owner address",owner_mobile:"Owner mobile",owner_email:"Owner email",f1_name:"Founder 1 name",f2_name:"Founder 2 name",flat_addr:"Flat address",cap:"amount",haritt_mobile:"Haritt mobile",place:"City",date:"date"},
 hi:{owner_name:"मालिक का पूरा नाम",owner_parent:"पिता/पति का नाम",owner_addr:"मालिक का पता",owner_mobile:"मालिक का मोबाइल",owner_email:"मालिक का ईमेल",f1_name:"Founder 1 का नाम",f2_name:"Founder 2 का नाम",flat_addr:"फ्लैट का पता",cap:"रकम",haritt_mobile:"Haritt मोबाइल",place:"शहर",date:"तारीख"}};
function fill(t,v,mode,lang){return t.replace(/\{\{(\w+)\}\}/g,(m,k)=>{const x=String(v[k]||"").trim();return mode==="pdf"?(x||"________"):"\u0001"+(x?"v:"+x:"e:["+(LABEL[lang||LANG][k]||k)+"]")+"\u0002"})}
function html(t,v){let x=esc(fill(t,v,"html"));x=x.replace(/\u0001v:([^\u0002]*)\u0002/g,'<span class="v">$1</span>').replace(/\u0001e:([^\u0002]*)\u0002/g,'<span class="ph e">$1</span>');return x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function paper(v,full){
  const C=LANG==="hi"?CONTENT_HI:CONTENT.map(x=>x.t),Cs=CONTENT;
  let h='<div class="paper'+(full?" full":"")+'"><div class="t">'+(LANG==="hi"?TITLE.hi:TITLE.en.toUpperCase())+'</div><div class="s">'+esc(SUBTITLE[LANG])+'</div>';
  Cs.forEach((it,i)=>{const t=C[i];if(it.k==="h")h+="<h4>"+html(t,v)+"</h4>";else if(it.k==="p")h+="<p>"+html(t,v)+"</p>";else h+='<div class="c"><span class="n">'+esc(it.n)+"</span><div>"+html(t,v)+"</div></div>"});
  return h+"</div>"}
function plain(v){return CONTENT.map(it=>(it.n?it.n+" ":"")+fill(it.t,v,"pdf").replace(/\*\*/g,"")).join("\n")}

/* ---------- signature pad ---------- */
function pad(host){
  host.innerHTML='<canvas></canvas><div class="baseline"></div><div class="hint"><div>'+B("Sign here with your finger","यहाँ अंगुली से साइन करें")+'</div></div>';
  const c=$("canvas",host),x=c.getContext("2d");let draw=false,last=null,len=0;sig=null;
  function size(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);x.lineWidth=2.6;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";x.fillStyle="#111"}
  size();
  const pt=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  c.addEventListener("pointerdown",e=>{e.preventDefault();c.setPointerCapture(e.pointerId);draw=true;last=pt(e);x.beginPath();x.arc(last.x,last.y,1.3,0,7);x.fill()});
  c.addEventListener("pointermove",e=>{if(!draw)return;e.preventDefault();const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();len+=Math.hypot(p.x-last.x,p.y-last.y);last=p;host.classList.add("has");if(len>60)sig=true;upd()});
  const end=()=>{draw=false};c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
  host.clear=()=>{x.clearRect(0,0,c.width,c.height);len=0;sig=null;host.classList.remove("has");upd()};
  host.export=()=>{const r=c.getBoundingClientRect(),o=document.createElement("canvas");o.width=600;o.height=Math.round(600*r.height/r.width);o.getContext("2d").drawImage(c,0,0,o.width,o.height);return o.toDataURL("image/png")};
}

function statusCard(){

    h+='<div class="party"><div><div class="nm">'+esc(p.name)+(k==="f1"?B(" (you)"," (आप)"):"")+'</div><div class="sub">'+B(ROLE_LABEL[k],ROLE_HI[k])+" · "+esc(p.email)+'</div>'+

    '</div><span class="pill '+(p.signedAt?"ok":"wait")+'">'+(p.signedAt?B("Signed","साइन हुआ"):B("Waiting","इंतज़ार"))+'</span></div>'}
  return h+'</div>'}
function wireStatus(){
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(S.links[b.dataset.copy]);toast(tt("Link copied","लिंक कॉपी हो गया"))}catch(e){prompt("Copy this link",S.links[b.dataset.copy])}});

function screenStatus(){
  show('<div class="card top"><div class="eyebrow">'+B("— Agreement sent","— एग्रीमेंट भेज दिया गया")+'</div><h1>'+B("Waiting for signatures","साइन का इंतज़ार")+'</h1><p>'+B("Each person has been emailed a personal link. Use the buttons below if you want to send the link yourself.","हर व्यक्ति को ईमेल पर अपना लिंक भेज दिया गया है. अगर आप खुद लिंक भेजना चाहें तो नीचे के बटन इस्तेमाल करें.")+'</p></div>'+statusCard()+'<div class="card"><h2>'+B("Preview","झलक")+'</h2><div id="pp"></div></div>');
  const draw=()=>{$("#pp").innerHTML=paper(values())};redraw=draw;draw();wireStatus()}

/* ---------- PDF ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
/* Hindi pages are drawn on canvas (the browser shapes Devanagari correctly) and placed in the PDF as images */
async function hindiPages(v){
  try{await document.fonts.load('400 24px "Noto Sans Devanagari"');await document.fonts.load('700 24px "Noto Sans Devanagari"')}catch(e){}
  const Wp=1000,Hp=1450,pages=[];let cv,cx,y;
  const nw=()=>{cv=document.createElement("canvas");cv.width=Wp;cv.height=Hp;cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,Wp,Hp);cx.textBaseline="alphabetic";y=34;pages.push(cv)};
  const wrap=(text,font,maxW)=>{cx.font=font;const ws=text.split(/\s+/).filter(Boolean),ls=[];let cur="";for(const w of ws){const t=cur?cur+" "+w:w;if(cx.measureText(t).width>maxW&&cur){ls.push(cur);cur=w}else cur=t}if(cur)ls.push(cur);return ls};
  function para(text,o){o=Object.assign({x:0,size:23,lh:38,bold:false,color:"#1b1b1f",gap:9,num:""},o);const font=(o.bold?"700 ":"400 ")+o.size+'px "Noto Sans Devanagari",sans-serif',off=o.num?72:0,ls=wrap(text,font,Wp-o.x-off);
    ls.forEach((l,i)=>{if(y+o.lh>Hp-24)nw();cx.font=font;cx.fillStyle=o.color;if(i===0&&o.num){cx.fillStyle="#6e6e78";cx.fillText(o.num,o.x,y);cx.fillStyle=o.color}cx.fillText(l,o.x+off,y);y+=o.lh});y+=o.gap}
  nw();para("हिंदी अनुवाद (सिर्फ़ समझने के लिए)",{size:30,lh:46,bold:true,color:"#8B0D0D",gap:4});
  para("यह अनुवाद केवल समझाने के लिए है. असली और मान्य एग्रीमेंट ऊपर का English वाला है.",{size:21,lh:34,color:"#6e6e78",gap:20});
  para(TITLE.hi,{size:26,lh:42,bold:true,gap:4});para(SUBTITLE.hi,{size:20,lh:32,color:"#6e6e78",gap:16});
  CONTENT.forEach((it,i)=>{const t=fill(CONTENT_HI[i],v,"pdf","hi").replace(/\*\*/g,"");
    if(it.k==="h")y+=8,para(t,{size:24,lh:40,bold:true,color:"#8B0D0D",gap:4});else if(it.k==="p")para(t);else para(t,{num:it.n})});
  return pages}
async function makePDF(){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4",compress:true});
  const W=210,H=297,L=20,R=20,T=24,B=22,CW=W-L-R,v=values(),TE=TITLE.en;
  const clean=t=>t.replace(/₹/g,"Rs. ");
  let y=T+3;const RED=[139,13,13],ORG=[232,70,31],INK=[27,27,31],MUT=[110,110,120];
  let logo=null;try{logo=await loadImg("/assets/logo-256.png")}catch(e){}
  const brand=()=>{if(logo)doc.addImage(logo,"PNG",L,9,10,10);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(...INK);doc.setCharSpace(1.2);doc.text("HARITT DEVELOPERS",L+13,13.3);doc.setCharSpace(0);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...MUT);doc.text("A Haritt Group company",L+13,17.2);doc.setDrawColor(...ORG);doc.setLineWidth(.5);doc.line(L,21,W-R,21)};
  brand();
  const np=()=>{doc.addPage();brand();y=T};
  function rich(text,x,maxW,size,lh,color){
    text=clean(text);const words=[];text.split("**").forEach((s,i)=>s.split(/(\s+)/).forEach(w=>{if(w!=="")words.push({w,b:i%2===1})}));
    doc.setFontSize(size);doc.setTextColor(...(color||INK));let cx=x;
    if(y>H-B)np();
    for(const t of words){doc.setFont("helvetica",t.b?"bold":"normal");const tw=doc.getTextWidth(t.w);
      if(/^\s+$/.test(t.w)){if(cx>x)cx+=tw;continue}
      if(cx+tw>x+maxW+.01&&cx>x){y+=lh;cx=x;if(y>H-B)np()}
      doc.text(t.w,cx,y);cx+=tw}
    y+=lh}
  doc.setFont("helvetica","bold");doc.setFontSize(14.5);doc.setTextColor(...INK);doc.text(TE.toUpperCase(),W/2,y+2,{align:"center"});y+=8;
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...MUT);const sl=doc.splitTextToSize(SUBTITLE.en,CW);doc.text(sl,W/2,y,{align:"center"});y+=sl.length*4+3;
  doc.setDrawColor(210,210,215);doc.setLineWidth(.2);doc.line(L,y,W-R,y);y+=7;
  for(const it of CONTENT){
    const t=fill(it.t,v,"pdf");
    if(it.k==="h"){y+=3;if(y>H-B-14)np();rich("**"+clean(t)+"**",L,CW,10.5,5,RED);y+=.5}
    else if(it.k==="p"){rich(t,L,CW,9.5,4.7);y+=1.4}
    else{if(y>H-B-10)np();doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(...MUT);doc.text(it.n,L,y);rich(t,L+11,CW-11,9.5,4.7);y+=1.4}}
  np();doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(...INK);doc.text("SIGNATURES",L,y+2);y+=10;
  const order=["f1","f2","owner"];const sigImgs={};for(const k of order){sigImgs[k]=await loadImg(S.parties[k].sig)}
  for(const k of order){const p=S.parties[k];
    doc.setDrawColor(215,215,220);doc.setLineWidth(.25);doc.roundedRect(L,y,CW,44,2,2);
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...INK);doc.text(clean(p.name),L+5,y+8);
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.text(ROLE_LABEL[k]+(k==="f1"||k==="f2"?" · for Haritt Developers and personally":""),L+5,y+13);
    doc.text(p.email+(ph(p)?" · "+ph(p):""),L+5,y+17.5);doc.text("Signed on "+fmtTime(p.signedAt),L+5,y+22);
    const im=sigImgs[k],ww=Math.min(17*im.width/im.height,60);doc.addImage(p.sig,"PNG",L+CW-5-ww,y+6,ww,ww*im.height/im.width);
    doc.setDrawColor(150,150,160);doc.line(L+CW-65,y+26,L+CW-5,y+26);doc.setFontSize(7.5);doc.text("Signature",L+CW-65,y+30);
    doc.setFontSize(8);doc.text("Date: "+fmtDate(p.signedAt),L+5,y+38);
    y+=50}
  np();doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(...INK);doc.text("CERTIFICATE OF COMPLETION",L,y+2);y+=9;
  const hash=await sha256(TE+"\n"+plain(v));const done=Object.values(S.parties).map(p=>p.signedAt).sort().pop();
  const kv=(k,val,mono)=>{doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.text(k,L,y);doc.setFont(mono?"courier":"helvetica","normal");doc.setFontSize(mono?7.6:9.5);doc.setTextColor(...INK);const ls=doc.splitTextToSize(val,CW-42);doc.text(ls,L+42,y);y+=Math.max(6,ls.length*4.4+1.6)};
  kv("Document",TE);kv("Agreement ID","HD-"+S.id.slice(0,8).toUpperCase());kv("Sent by","Haritt Developers, a Haritt Group company");kv("Sent on",fmtTime(S.created));kv("Completed on",fmtTime(done));kv("Status","Signed by all parties");kv("Fingerprint (SHA-256)",hash,true);
  y+=3;doc.setDrawColor(210,210,215);doc.line(L,y,W-R,y);y+=7;
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...INK);doc.text("Signing record",L,y);y+=6;
  for(const k of order){const p=S.parties[k];doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...INK);doc.text(clean(p.name)+" · "+ROLE_LABEL[k],L,y);y+=4.8;
    doc.setFont("helvetica","normal");doc.setFontSize(8.8);doc.setTextColor(...MUT);doc.text("Email: "+p.email+(ph(p)?"   Mobile: "+ph(p):""),L,y);y+=4.4;doc.text("Signed: "+fmtTime(p.signedAt)+" · Drawn signature on the signer's own device",L,y);y+=4.4;
    doc.text("Access: personal link sent to the signer's email address",L,y);y+=7.5}
  y+=1;const note=doc.splitTextToSize("Each signer opened a personal link sent to their own email address, read the agreement, confirmed they understood it and drew their signature. The fingerprint above is calculated from the full English agreement text as signed. If a single word changes, the fingerprint changes. A Hindi translation follows for understanding; the English text is the agreement.",CW);
  doc.setFontSize(8.3);doc.setTextColor(...MUT);doc.text(note,L,y);
  try{const pgs=await hindiPages(v);for(const c of pgs){np();doc.addImage(c.toDataURL("image/jpeg",.9),"JPEG",L,T,CW,CW*c.height/c.width)}}catch(e){}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...MUT);doc.text("Agreement ID HD-"+S.id.slice(0,8).toUpperCase()+" · Signed electronically",L,H-10);doc.text("Page "+i+" of "+n,W-R,H-10,{align:"right"})}
  const blob=doc.output("blob"),buf=doc.output("arraybuffer");let bin="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return{blob,base64:btoa(bin)}}
function download(blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Haritt-Developers-Address-Agreement-Signed.pdf";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ---------- start ---------- */
(async function(){
  setLang(LANG);
  if(!API||API.startsWith("__"))return fail("Not ready yet","अभी तैयार नहीं है","This signing page is not connected yet. Please try again later.","यह साइनिंग पेज अभी जुड़ा नहीं है. कृपया बाद में कोशिश करें.");
  if(qp.has("new"))return screenCreate();
  if(!ID)return screenHome();
  if(!TOK)return screenCode();
  try{const r=await getView();
    if(!r.ok&&(r.error==="bad_link"||r.error==="locked"))return screenCode(r.error);
    if(!r.ok)return fail("This link does not work","यह लिंक काम नहीं कर रहा",r.error==="not_found"?"We could not find this agreement.":"The link is wrong or incomplete. Please open the link from your email again.",r.error==="not_found"?"यह एग्रीमेंट नहीं मिला.":"लिंक गलत या अधूरा है. कृपया अपने ईमेल से लिंक दोबारा खोलें.");
    S=r.view;
    if(S.complete&&!S.finalSent){try{await sendFinal()}catch(e){}}
    const me=S.parties[S.role];
    if(me.signedAt)return S.role==="f1"&&!S.complete?screenStatus():screenDone();
    screenSign();
  }catch(e){fail("No connection","इंटरनेट नहीं है","Check your internet and open the link again.","इंटरनेट जाँचें और लिंक दोबारा खोलें.")}
})();
