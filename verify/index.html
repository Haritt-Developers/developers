<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Verify agreement · Haritt Developers</title>
<link rel="icon" href="/assets/logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EE;--card:#fff;--tile:#FAFAF8;--line:#ECE7E1;--txt:#14161C;--mut:#4A505C;--dim:#8A91A0;--acc:#E8461F;--ok:#1B7F4F;--okb:#E7F5EC;--bad:#B42318;--badb:#FDECEA;--wait:#9A5B00;--waitb:#FFF4DE;--sh:0 6px 24px rgba(60,40,20,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1014;--card:#181B21;--tile:#20242C;--line:#2C313A;--txt:#F3F4F6;--mut:#C5CAD3;--dim:#8D94A1;--ok:#5BD69A;--okb:rgba(91,214,154,.12);--bad:#FF8A80;--badb:rgba(255,138,128,.12);--wait:#F5C26B;--waitb:rgba(245,194,107,.12);--sh:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 40px}
.brand{text-align:center;margin-bottom:22px}
.brand img{width:44px;height:44px;border-radius:50%;display:block;margin:0 auto}
.brand div{font:700 12px/1 Montserrat,Inter,sans-serif;letter-spacing:.18em;margin-top:11px}
.card{background:var(--card);border-radius:20px;padding:30px 24px 26px;box-shadow:var(--sh)}
.eb{text-align:center;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{text-align:center;font-size:24px;line-height:1.3;margin:6px 0 8px}
.lead{text-align:center;color:var(--mut);margin:0 auto;max-width:420px}
.badge{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;margin:0 auto 14px;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700}
.badge svg{width:16px;height:16px}
.ok{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}.wait{background:var(--waitb);color:var(--wait)}
.box{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:14px 18px 8px;margin-top:16px}
.bh{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13.5px}
.kv span{color:var(--dim);white-space:nowrap}.kv b{text-align:right;font-weight:600}
.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--mut);padding:2px 0 8px}
.pp{padding:10px 0;display:flex;justify-content:space-between;gap:12px}.pp+.pp{border-top:1px solid var(--line)}
.pp b{display:block;font-size:14.5px}.pp small{display:block;color:var(--dim);font-size:12.5px;line-height:1.5;margin-top:2px}
.pill{flex:none;align-self:flex-start;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.drop{display:block;margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer;background:var(--tile);transition:border-color .2s,background .2s}
.drop:hover,.drop.on{border-color:var(--acc)}
.drop input{display:none}.drop b{display:block;font-size:14.5px}.drop small{color:var(--dim);font-size:12.5px}
.res{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.res svg{flex:none;width:18px;height:18px;margin-top:1px}
.idf{display:flex;gap:8px;margin-top:16px}
.idf input{flex:1;min-width:0;font:15px Inter,sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--txt)}
.idf button{font:700 14.5px Inter,sans-serif;padding:0 18px;border-radius:99px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.small{text-align:center;color:var(--dim);font-size:12.5px;margin-top:18px}
.foot{text-align:center;color:var(--dim);font-size:12px;line-height:1.6;margin-top:20px}.foot a{color:inherit}
.spin{width:28px;height:28px;margin:30px auto;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.fade{animation:f .35s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/assets/logo-256.png" alt=""><div>HARITT DEVELOPERS</div></div>
  <main class="card" id="app"><div class="spin"></div></main>
  <div class="foot">Haritt Developers · A Haritt Group company<br>Behind Shiva Talkies, Sahyog Nagar, Bharatpur, Rajasthan 321001<br><a href="mailto:developers@haritt.com">developers@haritt.com</a></div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxlnGmdBPvi9BsWG7nxAIY9qWOF2yNGivhxrtj1OSRZ7CZFHkhLCwRcgsUftN_l-c4b/exec";
const $=s=>document.querySelector(s),app=$("#app"),ID=(new URLSearchParams(location.search).get("id")||"").replace(/[^A-Za-z0-9]/g,"").slice(0,40);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(t))+" IST":"";
const IC={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>'};
async function api(b){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:"verify"},b))});return r.json()}
async function sha(file){const h=await crypto.subtle.digest("SHA-256",await file.arrayBuffer());return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function dropBox(){return'<label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf"><b>Check a PDF file</b><small>Choose the signed PDF to confirm it is the original, unchanged. The file stays on your device.</small></label><div id="res"></div>'}
function wireDrop(id){const d=$("#drop"),f=$("#file");
  const go=async file=>{if(!file)return;$("#res").innerHTML='<div class="spin" style="margin:16px auto"></div>';
    try{const h=await sha(file),r=await api(id?{id:id,sha:h}:{sha:h});
      if(!id&&r.ok)return show(r,true);
      $("#res").innerHTML=r.ok&&r.match?'<div class="res ok fade">'+IC.ok+'<div><b>This PDF is the original.</b> It is exactly the file we emailed to every party when the agreement was completed. Nothing in it has changed.</div></div>'
        :!id?'<div class="res bad fade">'+IC.bad+'<div><b>We have no record of this exact file.</b> It may be a different download, or it may have been changed. Use the PDF attached to the "Agreement complete" email, or scan the QR code inside it.</div></div>'
        :'<div class="res bad fade">'+IC.bad+'<div><b>This file is not the exact copy we emailed.</b> It may be a different download, or it may have been changed. Use the PDF attached to the "Agreement complete" email, or check the details above against your file.</div></div>'}
    catch(e){$("#res").innerHTML='<div class="res bad fade">'+IC.bad+'<div>Could not check the file right now. Please try again.</div></div>'}};
  f.onchange=()=>go(f.files[0]);
  ["dragenter","dragover"].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add("on")}));
  ["dragleave","drop"].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove("on")}));
  d.addEventListener("drop",x=>go(x.dataTransfer.files[0]))}
function show(r,fromFile){
  const st={complete:["ok",IC.ok+"Genuine agreement","Everyone has signed"],cancelled:["bad",IC.bad+"Cancelled","This agreement was cancelled"],pending:["wait",IC.bad+"Not complete","Waiting for signatures"]}[r.status]||["wait","",""];
  const lead=r.status==="complete"?"This agreement was sent by Haritt Developers and signed by every party listed below.":r.status==="cancelled"?"Haritt Developers cancelled this agreement before it was completed. It is not in force.":"This agreement exists, but not everyone has signed it yet.";
  app.innerHTML='<div class="fade"><div class="badge '+st[0]+'">'+st[1]+'</div><div class="eb">Agreement '+esc(r.aid)+'</div><h1>'+esc(r.title)+'</h1><p class="lead">'+lead+'</p>'+
    (fromFile&&r.match?'<div class="res ok">'+IC.ok+'<div><b>Your PDF is the original.</b> It is exactly the file we emailed when the agreement was completed.</div></div>':'')+
    '<div class="box"><div class="bh">Details</div><div class="kv"><span>Agreement ID</span><b>'+esc(r.aid)+'</b></div><div class="kv"><span>Sent by</span><b>'+esc(r.sentBy)+'</b></div><div class="kv"><span>Sent on</span><b>'+fmt(r.created)+'</b></div>'+(r.completed?'<div class="kv"><span>Completed on</span><b>'+fmt(r.completed)+'</b></div>':'')+'</div>'+
    '<div class="box"><div class="bh">Signers</div>'+r.signers.map(p=>'<div class="pp"><div><b>'+esc(p.name)+'</b><small>'+esc(p.label)+(p.signedAt?'<br>Signed '+fmt(p.signedAt):'')+'</small></div><span class="pill '+(p.signedAt?"ok":"wait")+'">'+(p.signedAt?"Signed":"Pending")+'</span></div>').join("")+'</div>'+
    (r.fp?'<div class="box"><div class="bh">Text fingerprint (SHA-256)</div><div class="mono">'+esc(r.fp)+'</div></div>':'')+
    (r.status==="complete"&&r.sha&&!(fromFile&&r.match)?dropBox():'')+
    '<div class="small">Something looks wrong? Write to <a href="mailto:developers@haritt.com" style="color:inherit">developers@haritt.com</a></div></div>';
  if($("#drop"))wireDrop(ID||null)}
function notFound(msg){app.innerHTML='<div class="fade"><div class="badge bad">'+IC.bad+'Not found</div><h1>We could not find this agreement</h1><p class="lead">'+(msg||"Check that you scanned the QR code on a Haritt Developers PDF, or that the link is complete.")+'</p>'+dropBox()+'</div>';wireDrop(null)}
function start(){app.innerHTML='<div class="fade"><div class="eb">Verify</div><h1>Check a Haritt Developers agreement</h1><p class="lead">Scan the QR code on the last pages of the signed PDF, or choose the PDF file below to check it is genuine.</p>'+dropBox()+'</div>';wireDrop(null)}
(async()=>{if(!ID)return start();try{const r=await api({id:ID});r.ok?show(r):notFound()}catch(e){notFound("We could not reach our server. Please check your connection and try again.")}})();
</script>
</body>
</html>
