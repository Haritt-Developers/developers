<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>Client progress preview</title>
<style>
:root{--bg:#FAF8F5;--card:#fff;--ink:#17181C;--mu:#6F6B64;--ln:#ECE7E0;--acc:#E8461F;--accs:#FDEDE8;--ok:#1F9D6B;--oks:#E4F4EC;--am:#B7791F;--ams:#FFF3D6;--sh:0 1px 2px rgba(30,25,15,.05),0 12px 32px rgba(30,25,15,.06)}
[data-t=dark]{--bg:#0F1012;--card:#1A1B1F;--ink:#F4F1EC;--mu:#B1ACA3;--ln:#2C2D33;--acc:#FF7A4F;--accs:rgba(255,122,79,.15);--ok:#5FD7A5;--oks:rgba(95,215,165,.14);--am:#F5BE55;--ams:rgba(245,190,85,.14);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.4)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:18px 16px 70px}.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}.top h1{font-size:18px;margin:0;flex:1}.tg{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.lead{color:var(--mu);margin:0 0 22px;font-size:13.5px}
.lab{display:flex;gap:10px;align-items:center;margin:34px 0 12px;font-weight:700}.lab span{background:var(--acc);color:#fff;border-radius:8px;padding:2px 10px;font-size:13px}.lab small{font-weight:400;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--sh)}
svg.i{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-.15em}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}.p-ok{background:var(--oks);color:var(--ok)}.p-am{background:var(--ams);color:var(--am)}.p-ac{background:var(--accs);color:var(--acc)}.p-mu{background:var(--ln);color:var(--mu)}
.tk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px}.tk .i{font-size:19px;margin-top:1px}.tk.d{color:var(--mu)}.tk.d .i{color:var(--ok)}.tk.n .i{color:var(--acc)}.tk.a .i{color:var(--am)}.tk .t{flex:1}.tk.f{color:var(--mu)}.tk.f .i{color:var(--ln);filter:brightness(.8)}
.A{padding:26px 26px 22px}.A .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}.A .hd b{font-size:22px;letter-spacing:-.01em}.A .hd span{color:var(--mu);font-size:14px}
.rail{display:flex;overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x proximity;gap:0}
.nd{flex:1 0 128px;scroll-snap-align:center;text-align:center;position:relative;cursor:pointer;padding:0 6px}
.nd:before{content:"";position:absolute;top:21px;left:-50%;width:100%;height:4px;background:var(--ln);z-index:0}.nd:first-child:before{display:none}.nd.d:before,.nd.n:before,.nd.r:before{background:var(--ok)}
.dot{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--card);border:3px solid var(--ln);position:relative;z-index:1;font-size:21px;color:var(--mu);transition:.2s}
.nd.d .dot{background:var(--ok);border-color:var(--ok);color:#fff}.nd.r .dot{background:conic-gradient(var(--ok) 0 80%,var(--am) 0);border-color:transparent}.nd.r .dot:after{content:"";position:absolute;inset:4px;background:var(--card);border-radius:50%}.nd.r .dot .i{position:relative;z-index:2;color:var(--am)}
.nd.n .dot{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 6px var(--accs)}.nd b{display:block;font-size:13.5px}.nd small{color:var(--mu);font-size:12px}.nd.sel b{color:var(--acc)}
.det{margin-top:10px;background:var(--bg);border-radius:18px;padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}.det h3{grid-column:1/-1;margin:0 0 6px;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.B{padding:22px 0 18px}.B .hd{padding:0 24px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.B .hd b{font-size:20px}
.cols{display:flex;gap:14px;overflow-x:auto;padding:4px 24px 12px;scroll-snap-type:x mandatory}
.col{flex:0 0 250px;scroll-snap-align:start;border:1px solid var(--ln);border-radius:18px;padding:16px;background:var(--card)}.col.n{border-color:var(--acc);box-shadow:0 0 0 4px var(--accs)}.col .h{display:flex;align-items:center;gap:10px;margin-bottom:4px}.col .h b{flex:1;font-size:15px}.col .bar{height:6px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0 10px}.col .bar i{display:block;height:100%;background:var(--ok);border-radius:6px}.col.n .bar i{background:var(--acc)}.col.r .bar i{background:linear-gradient(90deg,var(--ok),var(--am))}
.ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:conic-gradient(var(--c,var(--ok)) calc(var(--p)*1%),var(--ln) 0);position:relative}.ring:after{content:"";position:absolute;inset:4px;background:var(--card);border-radius:50%}.ring span{position:relative;z-index:1}
.col.f{opacity:.75}
.C{overflow:hidden}.hero{background:radial-gradient(120% 140% at 0% 0%,#2B2F3A 0%,#14161C 60%);color:#fff;padding:28px 28px 22px;position:relative}.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(232,70,31,.35),transparent 65%)}
.hero .row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}.big{width:104px;height:104px;border-radius:50%;background:conic-gradient(#FF7A4F calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;position:relative}.big:after{content:"";position:absolute;inset:8px;background:#1A1C23;border-radius:50%}.big b{position:relative;z-index:1;font-size:26px}
.hero h2{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:#C9C5BD;font-size:14px}
.steps{display:flex;gap:8px;overflow-x:auto;margin-top:22px;position:relative;z-index:1;padding-bottom:4px}.st{flex:1 0 auto;display:flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:8px 14px;font-size:13px;white-space:nowrap;color:#D9D5CD}.st.d{background:rgba(95,215,165,.14);border-color:transparent;color:#8DE8C3}.st.n{background:#E8461F;border-color:#E8461F;color:#fff;font-weight:600}.st.r{background:rgba(245,190,85,.16);border-color:transparent;color:#F5BE55}
.notice{margin:18px 26px 0;display:flex;gap:12px;align-items:flex-start;background:var(--ams);color:var(--am);border-radius:14px;padding:12px 14px;font-size:14px}.notice .i{font-size:20px;margin-top:1px}.notice b{color:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px 26px 26px}.sc{border:1px solid var(--ln);border-radius:16px;padding:16px}.sc.n{border-color:var(--acc);background:linear-gradient(180deg,var(--accs),transparent 60%)}.sc h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}.sc h4 span{margin-left:auto}
@media(max-width:760px){.A{padding:20px 14px}.det{grid-template-columns:1fr}.grid{grid-template-columns:1fr;padding:16px}.hero{padding:22px 18px}.notice{margin:14px 16px 0}.cols{padding-left:16px;padding-right:16px}.B .hd{padding:0 16px 12px}.sc h4{flex-wrap:wrap}}
</style>
<div class=w id=w><div class=top><h1>Client portal: progress preview</h1><button class=tg onclick="document.documentElement.dataset.t=document.documentElement.dataset.t=='dark'?'light':'dark'">Theme</button></div>
<p class=lead>Three ways to show project progress to the client. Same project in all three: <b>Brief</b> and <b>Design</b> were finished, but one more Design task was added later (so Design shows "mostly done, 1 left"). Build is running.</p>
<div id=out></div></div>
<script>
const I={"done": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z\"/>", "todo": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z\"/>", "added": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z\"/>", "reopen": "<path d=\"M244,56v48a12,12,0,0,1-12,12H184a12,12,0,1,1,0-24H201.1l-19-17.38c-.13-.12-.26-.24-.38-.37A76,76,0,1,0,127,204h1a75.53,75.53,0,0,0,52.15-20.72,12,12,0,0,1,16.49,17.45A99.45,99.45,0,0,1,128,228h-1.37A100,100,0,1,1,198.51,57.06L220,76.72V56a12,12,0,0,1,24,0Z\"/>", "clock": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z\"/>", "flag": "<path d=\"M227.32,48.75A8,8,0,0,0,218.76,50c-28,24.22-51.72,12.48-79.21-1.13C111.07,34.76,78.78,18.79,42.76,50A8,8,0,0,0,40,56V224a8,8,0,0,0,16,0V179.77c26.79-21.16,49.87-9.75,76.45,3.41,28.49,14.09,60.77,30.06,96.79-1.13a8,8,0,0,0,2.76-6V56A8,8,0,0,0,227.32,48.75ZM216,71.6v40.65c-14,11.06-27,13.22-40,10.88V79.34A60.05,60.05,0,0,0,216,71.6Zm-56,3.76v43c-6.66-2.67-13.43-6-20.45-9.48-8.82-4.37-18-8.91-27.55-12.18v-43c6.66,2.66,13.43,6,20.45,9.48C141.27,67.55,150.46,72.09,160,75.36ZM96,48.91V92.69a60.06,60.06,0,0,0-40,7.75V59.78C70,48.72,83,46.57,96,48.91ZM86.58,152A60.06,60.06,0,0,0,56,160.43V119.78c14-11.06,27-13.22,40-10.88v43.8A65.61,65.61,0,0,0,86.58,152ZM112,156.67v-43c6.66,2.66,13.43,6,20.45,9.48,8.82,4.37,18,8.9,27.55,12.17v43c-6.66-2.67-13.43-6-20.45-9.48C130.73,164.47,121.54,159.94,112,156.67Zm64,26.45v-43.8a65.61,65.61,0,0,0,9.42.72A60.11,60.11,0,0,0,216,131.57v40.68C202,183.31,189,185.46,176,183.12Z\"/>", "check": "<path d=\"M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z\"/>", "spark": "<path d=\"M208,144a15.78,15.78,0,0,1-10.42,14.94L146,178l-19,51.62a15.92,15.92,0,0,1-29.88,0L78,178l-51.62-19a15.92,15.92,0,0,1,0-29.88L78,110l19-51.62a15.92,15.92,0,0,1,29.88,0L146,110l51.62,19A15.78,15.78,0,0,1,208,144ZM152,48h16V64a8,8,0,0,0,16,0V48h16a8,8,0,0,0,0-16H184V16a8,8,0,0,0-16,0V32H152a8,8,0,0,0,0,16Zm88,32h-8V72a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0V96h8a8,8,0,0,0,0-16Z\"/>", "wallet": "<path d=\"M216,64H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,56V184a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V80A16,16,0,0,0,216,64Zm0,128H56a8,8,0,0,1-8-8V78.63A23.84,23.84,0,0,0,56,80H216Zm-48-60a12,12,0,1,1,12,12A12,12,0,0,1,168,132Z\"/>", "cal": "<path d=\"M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Zm-68-76a12,12,0,1,1-12-12A12,12,0,0,1,140,132Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,132ZM96,172a12,12,0,1,1-12-12A12,12,0,0,1,96,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,140,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,172Z\"/>"};const ic=k=>'<svg class=i viewBox="0 0 256 256">'+I[k]+'</svg>';
const S=[{n:'Brief',s:'d',k:[['Kickoff call',1],['Requirements shared',1],['Scope and price agreed',1]],date:'Done 6 Nov'},
{n:'Design',s:'r',k:[['Homepage design',1],['Product page design',1],['Mobile design',1],['Checkout design',1],['Footer redesign',0,1]],date:'Done 9 Nov, 1 task added 14 Nov'},
{n:'Build',s:'n',k:[['Pages built',1],['Payments connected',1],['Blog setup',0],['Speed and security checks',0]],date:'Started 12 Nov'},
{n:'Review',s:'f',k:[['You review the site',0],['We fix your feedback',0]],date:'Next'},
{n:'Launch',s:'f',k:[['Site goes live on your domain',0],['Final checks',0]],date:'28 Nov'},
{n:'Handover',s:'f',k:[['Logins and guide shared',0],['Training call',0]],date:'After launch'}];
const done=s=>s.k.filter(t=>t[1]).length,tot=s=>s.k.length;
const allD=S.reduce((a,s)=>a+done(s),0),allT=S.reduce((a,s)=>a+tot(s),0),PCT=Math.round(100*allD/allT);
const task=(t,st)=>'<div class="tk '+(t[1]?'d':t[2]?'a':(st&&st.s=='f')?'f':'n')+'"><span>'+ic(t[1]?'done':t[2]?'added':'todo')+'</span><span class=t>'+t[0]+(t[2]&&!t[1]?' <span class="pill p-am">Added 14 Nov</span>':'')+'</span></div>';
const lbl=s=>s.s=='d'?'<span class="pill p-ok">Done</span>':s.s=='r'?'<span class="pill p-am">'+done(s)+' of '+tot(s)+' done · 1 added later</span>':s.s=='n'?'<span class="pill p-ac">In progress · '+done(s)+' of '+tot(s)+'</span>':'<span class="pill p-mu">Coming up</span>';
let sel=2;
function A(){return '<div class=lab><span>A</span>Horizontal rail <small>tap a stage to see its tasks</small></div><div class="card A"><div class=hd><div><b>Your project is '+PCT+'% done</b><br><span>Now: Build · Launch planned 28 Nov 2026</span></div><span class="pill p-ok">'+ic('cal')+' On track</span></div><div class=rail>'+S.map((s,i)=>'<div class="nd '+s.s+(i==sel?' sel':'')+'" onclick="sel='+i+';draw()"><div class=dot>'+(s.s=='d'?ic('check'):s.s=='r'?ic('reopen'):(i+1))+'</div><b>'+s.n+'</b><small>'+(s.s=='d'?'Done':s.s=='r'?'1 task left':s.s=='n'?'In progress':'Coming up')+'</small></div>').join('')+'</div><div class=det><h3>'+S[sel].n+' '+lbl(S[sel])+'</h3>'+S[sel].k.map(t=>task(t,S[sel])).join('')+'</div></div>'}
function B(){return '<div class=lab><span>B</span>Stage cards in a row <small>swipe sideways</small></div><div class="card B"><div class=hd><b>Project progress</b><span class="pill p-ac">'+PCT+'% complete</span></div><div class=cols>'+S.map(s=>{const p=Math.round(100*done(s)/tot(s));return '<div class="col '+s.s+'"><div class=h><b>'+s.n+'</b><div class=ring style="--p:'+p+';--c:'+(s.s=='n'?'var(--acc)':s.s=='r'?'var(--am)':'var(--ok)')+'"><span>'+p+'</span></div></div><div style="font-size:12.5px;color:var(--mu)">'+s.date+'</div><div class=bar><i style="width:'+p+'%"></i></div>'+s.k.map(t=>task(t,s)).join('')+'</div>'}).join('')+'</div></div>'}
function C(){return '<div class=lab><span>C</span>Premium dark header + stage cards <small>full overview</small></div><div class="card C"><div class=hero><div class=row><div class=big style="--p:'+PCT+'"><b>'+PCT+'%</b></div><div><h2>Online store</h2><p>Now building. Launch planned 28 Nov 2026. 2 tasks left in Build.</p></div></div><div class=steps>'+S.map(s=>'<div class="st '+s.s+'">'+(s.s=='d'?ic('done'):s.s=='r'?ic('reopen'):s.s=='n'?ic('spark'):ic('todo'))+s.n+'</div>').join('')+'</div></div><div class=notice>'+ic('added')+'<div><b>Update on Design:</b> a new task, "Footer redesign", was added on 14 Nov at your request. Design is mostly done, 1 task left. This does not delay Build.</div></div><div class=grid>'+S.map(s=>'<div class="sc '+s.s+'"><h4>'+s.n+'<span>'+lbl(s)+'</span></h4>'+s.k.map(t=>task(t,s)).join('')+'</div>').join('')+'</div></div>'}
function draw(){document.getElementById('out').innerHTML=A()+B()+C()}draw();
</script>
