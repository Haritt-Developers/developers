<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>Client progress preview 2</title>
<style>
:root{--bg:#F6F3EE;--card:#fff;--ink:#16171B;--mu:#7A756C;--ln:#E4DED5;--acc:#E8461F;--ok:#1B8A5E;--am:#B7791F}
*{box-sizing:border-box}body{margin:0;background:#E9E5DE;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:1120px;margin:0 auto;padding:18px 14px 70px}.top{display:flex;gap:12px;align-items:center}.top h1{font-size:17px;margin:0;flex:1}
.lead{color:#6b665e;font-size:13.5px;margin:6px 0 18px}.lab{display:flex;gap:10px;align-items:center;margin:30px 0 12px;font-weight:700}.lab span{background:#16171B;color:#fff;border-radius:8px;padding:2px 10px;font-size:13px}.lab small{font-weight:400;color:#6b665e}
svg.i{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-.15em}
.sheet{border-radius:26px;overflow:hidden;box-shadow:0 20px 60px rgba(30,25,15,.14)}
/* D editorial */
.D{background:var(--bg);padding:44px 30px 40px}
.D .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600}
.D h2{font:400 44px/1.1 Georgia,'Times New Roman',serif;margin:10px 0 8px;letter-spacing:-.02em}.D h2 em{color:var(--acc);font-style:italic}
.D .sub{color:var(--mu);max-width:560px;margin:0 0 38px}
.line{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.line:before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:var(--ln)}
.dcol{flex:1 0 156px;scroll-snap-align:start;position:relative;padding:0 18px 0 0}
.dcol .pt{width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--ln);position:relative;z-index:1;display:grid;place-items:center;font-size:13px;color:#fff;margin-bottom:16px}
.dcol.d .pt{background:var(--ok);border-color:var(--ok)}.dcol.r .pt{background:var(--am);border-color:var(--am)}.dcol.n .pt{border-color:var(--acc);background:var(--bg);box-shadow:0 0 0 7px rgba(232,70,31,.12)}.dcol.n .pt:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dcol:before{content:"";position:absolute;left:0;top:11px;height:2px;width:100%;background:var(--ok);z-index:0;display:none}.dcol.d:before,.dcol.r:before{display:block}
.dcol h4{margin:0;font:600 17px/1.2 Inter;letter-spacing:-.01em}.dcol .st{font-size:12.5px;color:var(--mu);margin:3px 0 12px}.dcol.n h4{color:var(--acc)}
.dcol ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}.dcol li{padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px;display:flex;gap:8px;align-items:flex-start}.dcol li .i{font-size:15px;margin-top:2px;color:#c9c3b9}.dcol li.d{color:var(--mu)}.dcol li.d .i{color:var(--ok)}.dcol li.n .i{color:var(--acc)}.dcol li.a .i{color:var(--am)}.dcol li.f{color:#a39e94}
.tag{font-size:11px;font-weight:600;color:var(--am);background:#FFF1D1;border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.D .note{margin-top:26px;font-size:14px;color:var(--mu);border-left:3px solid var(--am);padding-left:14px;max-width:640px}.D .note b{color:var(--ink)}
/* E dark glass */
.E{background:radial-gradient(90% 70% at 15% 0%,#262a44 0%,#0c0d14 55%),#0c0d14;color:#EEF0F7;padding:38px 34px 36px;position:relative}
.E:after{content:"";position:absolute;right:-80px;bottom:-60px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(232,70,31,.28),transparent 65%);pointer-events:none}
.E .hd{display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:26px;position:relative;z-index:1}.E h2{margin:0;font-size:30px;letter-spacing:-.02em}.E .hd p{margin:4px 0 0;color:#9AA0B8}
.E .pc{font-size:56px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,#FFB38F,#FF6A3D);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.gb{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin:0 0 24px;position:relative;z-index:1;overflow:hidden}.gb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3DD6A0,#FFB347 60%,#FF6A3D);box-shadow:0 0 18px rgba(255,106,61,.6)}
.egrid{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;position:relative;z-index:1;padding-bottom:6px}
.g{flex:1 0 190px;scroll-snap-align:start;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;backdrop-filter:blur(12px)}
.g.n{border-color:rgba(255,106,61,.7);box-shadow:0 0 0 1px rgba(255,106,61,.3),0 0 40px rgba(255,106,61,.18)}.g.f{opacity:.6}
.g .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.g .h b{font-size:15px}.g .badge{font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.1);color:#C9CDE0}
.g.d .badge{background:rgba(61,214,160,.16);color:#6FE8BE}.g.r .badge{background:rgba(255,179,71,.16);color:#FFC878}.g.n .badge{background:rgba(255,106,61,.2);color:#FF9C78}
.g .t{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13.5px;color:#C9CDE0}.g .t .i{font-size:17px;margin-top:1px;color:#5A6080}.g .t.d{color:#8c92ab}.g .t.d .i{color:#3DD6A0}.g .t.n .i{color:#FF8A5E}.g .t.a .i{color:#FFB347}.g .t.f{color:#6e7490}
.E .tag{background:rgba(255,179,71,.18);color:#FFC878}
/* F gantt */
.F{background:#fff;padding:34px 34px 32px}
.F h2{margin:0;font-size:24px;letter-spacing:-.02em}.F .sub{color:var(--mu);margin:4px 0 22px}
.ax{display:grid;grid-template-columns:150px 1fr;font-size:11.5px;color:var(--mu);margin-bottom:4px}.ax div:last-child{display:flex;justify-content:space-between;border-bottom:1px solid var(--ln);padding-bottom:6px}
.rw{display:grid;grid-template-columns:150px 1fr;align-items:center;padding:7px 0;cursor:pointer;border-bottom:1px solid #F0ECE5}.rw .nm{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}.rw .nm small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.tr{position:relative;height:34px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/7 - 1px),#F0ECE5 0 calc(100%/7))}
.bar{position:absolute;top:3px;height:28px;border-radius:9px;background:#EEF0F3;overflow:hidden;display:flex;align-items:center;font-size:12px;font-weight:600;padding-left:10px;color:#fff}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:9px 0 0 9px}.bar span{position:relative;z-index:1}
.bar.r i{background:linear-gradient(90deg,var(--ok),#D9A441)}.bar.n i{background:var(--acc)}.bar.f{background:repeating-linear-gradient(135deg,#F1EEE8 0 6px,#EAE6DE 0 12px);color:#8a857b}.bar.f span{color:#8a857b}
.exp{display:none;grid-column:1/-1;padding:10px 4px 14px 150px;gap:2px 28px;grid-template-columns:1fr 1fr}.rw.open+.exp{display:grid}
.exp div{display:flex;gap:8px;font-size:13.5px;padding:3px 0}.exp .d{color:var(--mu)}.exp .d .i{color:var(--ok)}.exp .n .i{color:var(--acc)}.exp .a .i{color:var(--am)}.exp .f{color:#a39e94}.exp .i{font-size:16px;margin-top:2px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--acc)}
@media(max-width:760px){.D{padding:28px 18px}.D h2{font-size:32px}.E{padding:26px 16px}.E .pc{font-size:44px}.F{padding:22px 14px}.ax,.rw{grid-template-columns:92px 1fr}.exp{padding-left:0;grid-template-columns:1fr}.rw .nm small{display:none}}
</style>
<div class=w><div class=top><h1>Client portal: progress preview (round 2)</h1></div>
<p class=lead>Same project in all three: Brief and Design were finished, one more Design task was added later (14 Nov), Build is running. Scroll sideways inside D and E on phone.</p>
<div id=out></div></div>
<script>
const I={"done": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z\"/>", "todo": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z\"/>", "added": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z\"/>", "reopen": "<path d=\"M244,56v48a12,12,0,0,1-12,12H184a12,12,0,1,1,0-24H201.1l-19-17.38c-.13-.12-.26-.24-.38-.37A76,76,0,1,0,127,204h1a75.53,75.53,0,0,0,52.15-20.72,12,12,0,0,1,16.49,17.45A99.45,99.45,0,0,1,128,228h-1.37A100,100,0,1,1,198.51,57.06L220,76.72V56a12,12,0,0,1,24,0Z\"/>", "clock": "<path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z\"/>", "flag": "<path d=\"M227.32,48.75A8,8,0,0,0,218.76,50c-28,24.22-51.72,12.48-79.21-1.13C111.07,34.76,78.78,18.79,42.76,50A8,8,0,0,0,40,56V224a8,8,0,0,0,16,0V179.77c26.79-21.16,49.87-9.75,76.45,3.41,28.49,14.09,60.77,30.06,96.79-1.13a8,8,0,0,0,2.76-6V56A8,8,0,0,0,227.32,48.75ZM216,71.6v40.65c-14,11.06-27,13.22-40,10.88V79.34A60.05,60.05,0,0,0,216,71.6Zm-56,3.76v43c-6.66-2.67-13.43-6-20.45-9.48-8.82-4.37-18-8.91-27.55-12.18v-43c6.66,2.66,13.43,6,20.45,9.48C141.27,67.55,150.46,72.09,160,75.36ZM96,48.91V92.69a60.06,60.06,0,0,0-40,7.75V59.78C70,48.72,83,46.57,96,48.91ZM86.58,152A60.06,60.06,0,0,0,56,160.43V119.78c14-11.06,27-13.22,40-10.88v43.8A65.61,65.61,0,0,0,86.58,152ZM112,156.67v-43c6.66,2.66,13.43,6,20.45,9.48,8.82,4.37,18,8.9,27.55,12.17v43c-6.66-2.67-13.43-6-20.45-9.48C130.73,164.47,121.54,159.94,112,156.67Zm64,26.45v-43.8a65.61,65.61,0,0,0,9.42.72A60.11,60.11,0,0,0,216,131.57v40.68C202,183.31,189,185.46,176,183.12Z\"/>", "check": "<path d=\"M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z\"/>", "spark": "<path d=\"M208,144a15.78,15.78,0,0,1-10.42,14.94L146,178l-19,51.62a15.92,15.92,0,0,1-29.88,0L78,178l-51.62-19a15.92,15.92,0,0,1,0-29.88L78,110l19-51.62a15.92,15.92,0,0,1,29.88,0L146,110l51.62,19A15.78,15.78,0,0,1,208,144ZM152,48h16V64a8,8,0,0,0,16,0V48h16a8,8,0,0,0,0-16H184V16a8,8,0,0,0-16,0V32H152a8,8,0,0,0,0,16Zm88,32h-8V72a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0V96h8a8,8,0,0,0,0-16Z\"/>", "wallet": "<path d=\"M216,64H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,56V184a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V80A16,16,0,0,0,216,64Zm0,128H56a8,8,0,0,1-8-8V78.63A23.84,23.84,0,0,0,56,80H216Zm-48-60a12,12,0,1,1,12,12A12,12,0,0,1,168,132Z\"/>", "cal": "<path d=\"M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Zm-68-76a12,12,0,1,1-12-12A12,12,0,0,1,140,132Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,132ZM96,172a12,12,0,1,1-12-12A12,12,0,0,1,96,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,140,172Zm44,0a12,12,0,1,1-12-12A12,12,0,0,1,184,172Z\"/>"};const ic=k=>'<svg class=i viewBox="0 0 256 256">'+I[k]+'</svg>';
const S=[{n:'Brief',s:'d',a:'2 Nov',b:'6 Nov',k:[['Kickoff call',1],['Requirements shared',1],['Scope and price agreed',1]]},
{n:'Design',s:'r',a:'6 Nov',b:'9 Nov',k:[['Homepage design',1],['Product page design',1],['Mobile design',1],['Checkout design',1],['Footer redesign',0,1]]},
{n:'Build',s:'n',a:'9 Nov',b:'18 Nov',k:[['Pages built',1],['Payments connected',1],['Blog setup',0],['Speed and security checks',0]]},
{n:'Review',s:'f',a:'18 Nov',b:'24 Nov',k:[['You review the site',0],['We fix your feedback',0]]},
{n:'Launch',s:'f',a:'24 Nov',b:'28 Nov',k:[['Site goes live on your domain',0],['Final checks',0]]},
{n:'Handover',s:'f',a:'28 Nov',b:'30 Nov',k:[['Logins and guide shared',0],['Training call',0]]}];
const done=s=>s.k.filter(t=>t[1]).length,tot=s=>s.k.length;
const allD=S.reduce((a,s)=>a+done(s),0),allT=S.reduce((a,s)=>a+tot(s),0),PCT=Math.round(100*allD/allT);
const cl=(t,s)=>t[1]?'d':t[2]?'a':s.s=='f'?'f':'n';
const li=(t,s)=>'<li class="'+cl(t,s)+'">'+ic(t[1]?'done':t[2]?'added':'todo')+'<span>'+t[0]+(t[2]&&!t[1]?'<span class=tag>Added 14 Nov</span>':'')+'</span></li>';

function D(){return '<div class=lab><span>D</span>Editorial timeline <small>no boxes, one line, tasks underneath</small></div><div class="sheet D"><div class=kick>Online store · Your project</div><h2>Build is <em>underway.</em></h2><p class=sub>'+PCT+'% complete. Launch planned for 28 November. Two tasks left in Build.</p><div class=line>'+S.map(s=>'<div class="dcol '+s.s+'"><div class=pt>'+(s.s=='d'?ic('check'):s.s=='r'?ic('reopen'):'')+'</div><h4>'+s.n+'</h4><div class=st>'+stText(s)+'</div><ul>'+s.k.map(t=>li(t,s)).join('')+'</ul></div>').join('')+'</div><div class=note><b>Design update:</b> "Footer redesign" was added on 14 Nov at your request. Design stays mostly complete with one task left, and Build carries on.</div></div>'}
function E(){return '<div class=lab><span>E</span>Dark glass <small>full dark, glowing progress</small></div><div class="sheet E"><div class=hd><div><h2>Online store</h2><p>Now building · Launch 28 Nov 2026</p></div><div class=pc>'+PCT+'%</div></div><div class=gb><i style="width:'+PCT+'%"></i></div><div class=egrid>'+S.map(s=>'<div class="g '+s.s+'"><div class=h><b>'+s.n+'</b><span class=badge>'+(s.s=='d'?'Done':s.s=='r'?'1 task left':s.s=='n'?'In progress':'Coming up')+'</span></div>'+s.k.map(t=>'<div class="t '+cl(t,s)+'">'+ic(t[1]?'done':t[2]?'added':'todo')+'<span>'+t[0]+(t[2]&&!t[1]?' <span class=tag>Added 14 Nov</span>':'')+'</span></div>').join('')+'</div>').join('')+'</div></div>'}
const DAYS=['2 Nov','6','10','14','18','22','26','30 Nov'];

function Fv(){const t0=2,t1=30,span=t1-t0,pos=d=>100*(d-t0)/span,today=14;
return '<div class=lab><span>F</span>Project timeline <small>bars by date, tap a row for its tasks</small></div><div class="sheet F"><h2>Your project timeline</h2><p class=sub>'+PCT+'% complete · Launch 28 Nov · Today is 14 Nov</p><div class=ax><div></div><div>'+DAYS.map(d=>'<span>'+d+'</span>').join('')+'</div></div>'+S.map((s,i)=>{const a=day(s.a),b=day(s.b),l=pos(a),w=pos(b)-l,p=Math.round(100*done(s)/tot(s));return '<div class=rw onclick="this.classList.toggle(\'open\')"><div class=nm><span>'+s.n+'<small>'+(s.s=='d'?'Done':s.s=='r'?'1 task left':s.s=='n'?'In progress':'Coming up')+'</small></span></div><div class=tr><div class="bar '+s.s+'" style="left:'+l+'%;width:'+w+'%"><i style="width:'+p+'%"></i><span>'+done(s)+'/'+tot(s)+'</span></div><div class=today style="left:'+pos(today)+'%"></div></div></div><div class=exp>'+s.k.map(t=>'<div class="'+cl(t,s)+'">'+ic(t[1]?'done':t[2]?'added':'todo')+'<span>'+t[0]+(t[2]&&!t[1]?'<span class=tag>Added 14 Nov</span>':'')+'</span></div>').join('')+'</div>'}).join('')+'</div>'}

document.querySelectorAll('.rw')[2].classList.add('open');
