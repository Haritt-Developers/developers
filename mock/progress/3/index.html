<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Progress preview 3 · Chapters</title>
<link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../m.css">
<style>
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:36px 0 20px}
.intro .eb{font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.22em;color:var(--mu);text-transform:uppercase}
.intro h1{font-family:Montserrat,sans-serif;font-size:30px;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.15}.intro h1 em{font-style:normal;color:var(--acc)}.intro p{margin:0;color:var(--mu)}
.meter{display:flex;align-items:center;gap:14px;flex:none}.meter .n{font-family:Montserrat,sans-serif;font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}.meter .n small{font-size:20px;color:var(--mu)}.meter .x{font-size:13px;color:var(--mu);line-height:1.4}.meter .x b{color:var(--ink);display:block;font-size:14px}
#payslot{margin-bottom:18px}
/* horizontal chapters */
.strip{display:flex;gap:10px;min-height:440px;align-items:stretch}
.ch{flex:0 0 92px;border-radius:24px;position:relative;overflow:hidden;cursor:pointer;transition:flex .55s cubic-bezier(.2,.8,.2,1),background .3s;border:1px solid var(--ln);background:var(--card);outline:none;display:flex}
.ch:focus-visible{box-shadow:0 0 0 3px var(--accs)}
.ch.done,.ch.reopened{background:linear-gradient(180deg,var(--accs),var(--card) 70%)}
.ch.now{background:#141519;border-color:#141519;color:#F3F0EB}
[data-t=dark] .ch.now{background:#1E1F24;border-color:#34353B}
.ch.now:after{content:"";position:absolute;width:420px;height:420px;right:-160px;bottom:-200px;background:radial-gradient(circle,rgba(232,70,31,.45),transparent 65%);pointer-events:none}
.ch.later,.ch.next{background:repeating-linear-gradient(135deg,transparent 0 10px,var(--ln2) 10px 11px),var(--card)}
.ch.open{flex:1 1 auto;cursor:default}
/* closed face */
.cf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0;transition:opacity .25s}
.ch.open .cf{opacity:0;pointer-events:none}
.num{font-family:Montserrat,sans-serif;font-weight:800;font-size:28px;letter-spacing:-.04em;color:var(--ln);line-height:1}
.ch.done .num,.ch.reopened .num{color:var(--acc);opacity:.45}.ch.now .num{color:#FF7A4F}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);font-family:Montserrat,sans-serif;font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:14px;white-space:nowrap}
.ch.later .vt,.ch.next .vt{color:var(--mu)}
.cfi{font-size:26px;color:var(--mu)}.ch.done .cfi,.ch.reopened .cfi{color:var(--ok)}
.plus{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--am);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}[data-t=dark] .plus{color:#1a1206}
.you{position:absolute;top:58px;left:50%;transform:translateX(-50%);color:var(--acc);font-size:20px}
/* open face */
.of{opacity:0;padding:30px 34px;display:flex;flex-direction:column;min-width:520px;width:100%;position:relative;z-index:1;transition:opacity .3s .15s}
.ch.open .of{opacity:1}
.ofh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.ofh .big{font-family:Montserrat,sans-serif;font-weight:800;font-size:76px;line-height:.85;letter-spacing:-.05em;background:linear-gradient(160deg,var(--acc2),var(--acc) 60%,transparent 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ch.later .ofh .big,.ch.next .ofh .big{background:none;color:var(--ln)}
.ofh .stt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.of h3{font-family:Montserrat,sans-serif;font-size:30px;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 4px;font-weight:800;display:flex;align-items:center;gap:12px}
.of h3 svg{font-size:34px;color:var(--acc)}.ch.now .of h3 svg{color:#FF7A4F}
.of .ds{font-size:13.5px;opacity:.7;display:flex;gap:6px;align-items:center}
.bar{display:flex;gap:4px;margin:18px 0 14px}.bar i{flex:1;height:6px;border-radius:6px;background:var(--track)}.ch.now .bar i{background:rgba(255,255,255,.14)}
.bar i.d{background:var(--acc)!important}.bar i.n{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%) var(--track);background-size:200% 100%;animation:fl 1.8s ease-in-out infinite alternate}.ch.now .bar i.n{background-color:rgba(255,255,255,.14)}
.bar i.a{background:var(--am)!important;opacity:.7}
@keyframes fl{from{background-position:100% 0}to{background-position:0 0}}
.tk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.tk li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px;border-bottom:1px solid var(--ln2)}.ch.now .tk li{border-color:rgba(255,255,255,.08)}
.tk li svg{font-size:20px;margin-top:1px;opacity:.45}.tk li.d svg{color:var(--ok);opacity:1}.ch.now .tk li.d svg{color:#4FD39A}.tk li.n svg{color:#FF7A4F;opacity:1}.tk li.a svg{color:var(--am);opacity:1}
.tk li div{min-width:0}.tk li small{display:block;font-size:12px;opacity:.65}
.ch.now .chip.c-acc{background:rgba(255,122,79,.18);color:#FF9A6B}.ch.now .chip.c-mu{background:rgba(255,255,255,.08);color:#C9C5BE}
.added{display:flex;gap:10px;align-items:flex-start;background:var(--ams);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}.added svg{color:var(--am);font-size:19px;margin-top:1px}
.of .empty{opacity:.7;display:flex;gap:10px;align-items:center;margin-top:10px}.of .empty svg{font-size:22px}
.of .nx{margin-top:auto;padding-top:14px;font-size:13px;opacity:.75;display:flex;gap:8px;align-items:center}
.hint{font-size:12.5px;color:var(--mu);margin:10px 4px 0;display:flex;gap:6px;align-items:center}
/* story list */
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:46px 0 6px}.h2 h2{font-family:Montserrat,sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0}.h2 span{font-size:13px;color:var(--mu)}
.story{position:relative}
.sr{display:grid;grid-template-columns:120px 1fr;gap:0 24px;position:relative;padding:22px 0;scroll-margin-top:16px}
.sr+.sr{border-top:1px solid var(--ln)}
.sn{font-family:Montserrat,sans-serif;font-weight:800;font-size:52px;letter-spacing:-.05em;line-height:.9;color:var(--ln)}
.sr.done .sn,.sr.reopened .sn{color:var(--acc);opacity:.35}.sr.now .sn{color:var(--acc)}
.sb h4{margin:0;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sb .meta{font-size:13px;color:var(--mu);margin:2px 0 10px}
.sl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.sl li{display:inline-flex;gap:7px;align-items:center;font-size:13.5px;padding:7px 12px 7px 9px;border-radius:12px;background:var(--card);border:1px solid var(--ln)}
.sl li svg{font-size:17px;color:var(--mu)}.sl li.d svg{color:var(--ok)}.sl li.n{border-color:var(--acc);color:var(--acc)}.sl li.n svg{color:var(--acc)}.sl li.a{background:var(--ams);border-color:transparent;color:var(--am)}.sl li.a svg{color:var(--am)}.sl li.y{border-style:dashed;border-color:var(--acc)}
.sl li em{font-style:normal;font-size:11.5px;opacity:.8}
.foot{color:var(--mu);font-size:12.5px;text-align:center;padding:30px 0 60px}
.mstrip{display:none}
@media (max-width:860px){.tk{grid-template-columns:1fr}.of{min-width:0}}
@media (max-width:720px){
 .intro{flex-direction:column;align-items:flex-start;padding:24px 0 16px}.intro h1{font-size:24px}.meter .n{font-size:38px}
 .strip{height:auto;flex-wrap:nowrap;gap:6px}
 .ch{flex:1 1 0;height:86px;border-radius:16px}.ch.open{flex:1 1 0}.ch .of{display:none}.ch.open .cf{opacity:1;pointer-events:auto}
 .cf{padding:10px 0}.vt{display:none}.num{font-size:22px}.cfi{font-size:20px}.plus{top:auto;bottom:8px;padding:1px 6px;font-size:10px;display:none}.you{display:none}
 .ch.open{box-shadow:0 0 0 2px var(--acc)}
 .strip .ch.reopened:before{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--am)}
 .mstrip{display:block;margin-top:10px}.mstrip .ch{display:flex;height:auto;border-radius:22px;cursor:default}.mstrip .of{display:flex;opacity:1;padding:22px 18px;min-width:0}.mstrip .cf{display:none}
 .mstrip .ofh .big{font-size:56px}.mstrip .of h3{font-size:22px;letter-spacing:.1em}.mstrip .tk{grid-template-columns:1fr}
 .sr{grid-template-columns:56px 1fr;gap:0 14px}.sn{font-size:36px}
}
</style></head><body>
<div id="app"></div>
<script src="../ic.js"></script><script src="../m.js"></script>
<script>
let OPEN=P.cur.i;
const tI=t=>t.d?ic('d:check-circle'):t.added?ic('d:plus-circle'):t.now?ic('r:circle-notch'):ic('r:circle');
const tC=t=>t.d?'d':t.added?'a':t.now?'n':'';
function chip(s){return s.st==='done'?`<span class="chip c-ok">${ic('r:check')} Complete</span>`:s.st==='reopened'?`<span class="chip c-ok">${ic('r:check')} Complete</span><span class="chip c-am">${ic('r:plus')} 1 added 14 Nov</span>`:s.st==='now'?`<span class="chip c-acc">In progress · ${s.done} of ${s.total}</span>`:s.st==='next'?`<span class="chip c-mu">Up next</span>`:`<span class="chip c-mu">Coming up</span>`}
function face(s){
 const next=P.stages[s.i+1];
 return `<div class="of"><div class="ofh"><div class="big">0${s.i+1}</div><div class="stt">${chip(s)}${s.okBy?`<span class="chip c-mu">${ic('r:thumbs-up')} You approved ${s.okBy}</span>`:''}${s.you?`<span class="chip c-acc">${ic('r:user')} Needs your OK</span>`:''}</div></div>
 <h3>${ic('d:'+s.ic)}${s.n}</h3><div class="ds">${ic('r:calendar-blank')}${s.st==='now'?`Started ${s.from} · aiming for ${s.to}`:s.st==='done'||s.st==='reopened'?`${s.from} – ${s.to}`:`Planned ${s.from} – ${s.to}`}</div>
 ${s.total?`<div class="bar">${s.tasks.map(t=>`<i class="${tC(t)}"></i>`).join('')}</div>`:''}
 ${s.added?`<div class="added">${ic('d:info')}<div>You asked for a festive offers banner on 14 Nov, so we added it here. The approved designs stay as they are, and <b>your launch date does not change.</b></div></div>`:''}
 ${s.total?`<ul class="tk">${s.tasks.map(t=>`<li class="${tC(t)}">${tI(t)}<div>${t.t}${t.d?`<small>Done ${t.d}</small>`:t.added?`<small>Added ${t.added} · ready by ${t.eta}</small>`:t.now?'<small>Working on it</small>':t.you?'<small>Your turn · we send a review link</small>':''}</div></li>`).join('')}</ul>`:`<div class="empty">${ic('d:handshake')}Logins, files and a short guide. Details come closer to the date.</div>`}
 ${next?`<div class="nx">${ic('r:arrow-right')}Then: ${next.n}, ${next.from} – ${next.to}</div>`:`<div class="nx">${ic('d:flag-checkered')}Final chapter</div>`}</div>`;
}
function strip(){
 return `<div class="strip">${P.stages.map(s=>`<div class="ch ${s.st} ${s.i===OPEN?'open':''}" tabindex="0" onclick="openCh(${s.i})" onkeydown="if(event.key==='Enter')openCh(${s.i})" aria-label="${s.n}">
  <div class="cf"><span class="num">0${s.i+1}</span>${s.added?'<span class="plus">+1</span>':''}${s.you?`<span class="you">${ic('r:user')}</span>`:''}<span class="vt">${s.n}</span><span class="cfi">${s.st==='done'||s.st==='reopened'?ic('d:check-circle'):s.st==='now'?ic('r:circle-notch'):ic('r:circle')}</span></div>${face(s)}</div>`).join('')}</div>
  <div class="mstrip" id="mstrip"></div>
  <div class="hint">${ic('r:info')}Tap any chapter to open it.</div>`;
}
function openCh(i){OPEN=i;document.querySelectorAll('.strip .ch').forEach((e,j)=>e.classList.toggle('open',j===i));ms()}
function ms(){const s=P.stages[OPEN];document.getElementById('mstrip').innerHTML=`<div class="ch ${s.st} open">${face(s)}</div>`}
function story(){
 return `<div class="story">${P.stages.map(s=>`<div class="sr ${s.st}"><div class="sn">0${s.i+1}</div><div class="sb"><h4>${s.n} ${chip(s)}</h4><div class="meta">${s.st==='now'?`Started ${s.from} · aiming for ${s.to}`:s.st==='done'||s.st==='reopened'?`${s.from} – ${s.to}${s.okBy?' · you approved '+s.okBy:''}`:`Planned ${s.from} – ${s.to}`}</div>
 ${s.total?`<ul class="sl">${s.tasks.map(t=>`<li class="${tC(t)}${t.you?' y':''}">${tI(t)}${t.t}${t.added?` <em>· added ${t.added}</em>`:t.d?` <em>· ${t.d}</em>`:''}</li>`).join('')}</ul>`:`<div class="note">${ic('r:flag')} Final step. Details come closer to the date.</div>`}</div></div>`).join('')}</div>`;
}
function paint(){}
document.getElementById('app').innerHTML=shell('3')+`<main class="w">
 <div class="intro"><div><div class="eb">${P.name} · Chapter 3 of 6</div><h1>Your site is being <em>built</em>.</h1><p>Two of four build tasks are done. Review comes next, then launch.</p></div>
 <div class="meter"><span class="n">${P.pct}<small>%</small></span><span class="x"><b>Launch ${P.launch}</b>${P.daysLeft} days to go · on track</span></div></div>
 <div id="payslot">${payCard()}</div>
 ${strip()}
 <div class="h2"><h2>The full story</h2><span>Updated today, ${TODAY}</span></div>
 ${story()}
 <div class="foot">Preview with sample data · Haritt Developers</div></main>`;
ms();
</script></body></html>
