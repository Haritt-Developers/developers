<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Progress preview 2 · Skyline</title>
<link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../m.css">
<style>
.hello{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:34px 0 20px}
.hello h1{font-family:Montserrat,sans-serif;font-size:28px;letter-spacing:-.02em;margin:0 0 4px}.hello p{margin:0;color:var(--mu)}
.kp{display:flex;gap:10px}.k{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 16px;min-width:120px}.k b{display:block;font-family:Montserrat,sans-serif;font-size:22px;letter-spacing:-.02em}.k span{font-size:12px;color:var(--mu)}
#payslot{margin-bottom:18px}
.sky{background:var(--card);border:1px solid var(--ln);border-radius:28px;box-shadow:var(--sh);padding:26px 28px 24px;position:relative;overflow:hidden}
.sky:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ln2) 1px,transparent 1px);background-size:100% 44px;opacity:.7;pointer-events:none;mask-image:linear-gradient(transparent,#000 30%,#000 80%,transparent)}
.skh{display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;margin-bottom:8px}.skh h2{margin:0;font-size:16px}.skh .lgd{display:flex;gap:14px;font-size:12px;color:var(--mu)}.lgd span{display:flex;align-items:center;gap:6px}.lgd i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cols{display:flex;gap:14px;align-items:flex-end;position:relative;padding-top:6px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch;cursor:pointer;position:relative;outline:none}
.stk{display:flex;flex-direction:column-reverse;gap:6px;padding:0 4px}
.b{height:38px;border-radius:10px;display:flex;align-items:center;gap:7px;padding:0 9px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;position:relative;transition:transform .25s}
.b span{overflow:hidden;text-overflow:ellipsis}.b svg{font-size:15px}
.b.d{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.b.n{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc),0 0 0 5px var(--accs);animation:gl 2s ease-in-out infinite}
@keyframes gl{50%{box-shadow:inset 0 0 0 2px var(--acc),0 0 0 9px transparent}}
.b.t{background:transparent;color:var(--mu);box-shadow:inset 0 0 0 1.5px var(--ln);border:0;background-image:repeating-linear-gradient(90deg,var(--ln) 0 6px,transparent 6px 10px);background-size:100% 1.5px;background-repeat:no-repeat}
.b.t{background:var(--ln2);box-shadow:none}
.b.a{background:repeating-linear-gradient(-45deg,var(--hatch) 0 6px,transparent 6px 12px),var(--ams);color:var(--am);box-shadow:inset 0 0 0 1.5px var(--am);overflow:visible}
.tag{position:absolute;right:-4px;top:-22px;background:var(--am);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}[data-t=dark] .tag{color:#1a1206}
.b.e{height:54px;justify-content:center;color:var(--mu);border:1.5px dashed var(--ln);font-size:20px}
.cap{text-align:center;margin-bottom:10px;min-height:26px;display:flex;justify-content:center}
.col:hover .b{transform:translateY(-2px)}
.col.sel .stk{filter:none}
.base{height:4px;border-radius:4px;background:var(--track);margin-top:12px}.col.done .base,.col.reopened .base{background:var(--ok)}.col.now .base{background:linear-gradient(90deg,var(--ok),var(--acc))}
.lab{padding:12px 4px 0;text-align:left}.lab .nm{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden}.lab .nm i{font-style:normal;font-family:Montserrat,sans-serif;font-size:11px;color:var(--mu);letter-spacing:.06em}
.lab .s{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.col.now .lab .nm{color:var(--acc)}.col.done .lab .s,.col.reopened .lab .s{color:var(--ok)}.col.now .lab .s{color:var(--acc)}
.col.sel .lab .nm span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;text-decoration-color:var(--acc)}
.beam{position:absolute;top:0;bottom:44px;left:50%;width:0;border-left:1.5px dashed var(--acc);opacity:.55;z-index:0}
.here{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;z-index:2;display:flex;gap:5px;align-items:center}
.here svg{font-size:13px}
.col .stk,.col .cap{position:relative;z-index:1}
.mcap{display:none}.tln small.m{display:none}
/* accordion */
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 12px}.h2 h2{font-family:Montserrat,sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0}.h2 span{font-size:13px;color:var(--mu)}
.ac{background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.row{border-bottom:1px solid var(--ln);scroll-margin-top:16px}.row:last-child{border-bottom:0}
.rh{display:flex;align-items:center;gap:14px;padding:16px 20px;width:100%;border:0;background:none;text-align:left}
.ri{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:var(--ln2);color:var(--mu);flex:none}
.row.done .ri,.row.reopened .ri{background:var(--oks);color:var(--ok)}.row.now .ri{background:var(--accs);color:var(--acc)}
.rt{flex:1;min-width:0}.rt b{display:flex;gap:8px;align-items:center;font-size:15.5px;flex-wrap:wrap}.rt span{display:block;font-size:13px;color:var(--mu)}
.mini{display:flex;gap:3px}.mini i{width:8px;height:8px;border-radius:3px;background:var(--track)}.mini i.d{background:var(--acc)}.mini i.a{background:var(--am)}.mini i.n{background:var(--acc);opacity:.45}
.rh .cv{font-size:18px;color:var(--mu);transition:transform .25s}.row.open .cv{transform:rotate(180deg)}
.rb{display:none;padding:0 20px 20px 76px}.row.open .rb{display:block}.row.open{background:linear-gradient(180deg,var(--ln2),transparent 80px)}
.tln{list-style:none;margin:0;padding:0;position:relative}
.tln li{position:relative;padding:0 0 16px 30px;display:flex;justify-content:space-between;gap:12px}.tln li:last-child{padding-bottom:0}
.tln li:before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--ln)}.tln li:last-child:before{display:none}
.tln li.d:before{background:var(--ok)}
.tln .dot{position:absolute;left:0;top:1px;font-size:18px;color:var(--mu);background:var(--card);border-radius:50%}
.tln li.d .dot{color:var(--ok)}.tln li.n .dot{color:var(--acc)}.tln li.a .dot{color:var(--am)}
.tln b{font-weight:500;display:block}.tln small{display:block;color:var(--mu);font-size:12.5px}.tln .w{font-size:12.5px;color:var(--mu);white-space:nowrap;padding:0;margin:0;max-width:none}
.why{display:flex;gap:10px;font-size:13.5px;background:var(--ams);border-radius:12px;padding:10px 12px;margin:2px 0 16px}.why svg{color:var(--am);font-size:19px;margin-top:1px}
.foot{color:var(--mu);font-size:12.5px;text-align:center;padding:30px 0 60px}
@media (max-width:720px){
 .hello{flex-direction:column;align-items:flex-start;padding:24px 0 16px}.hello h1{font-size:24px}.kp{width:100%}.k{flex:1;min-width:0;padding:10px 12px}
 .sky{padding:18px 14px 16px;border-radius:22px}.skh .lgd{display:none}
 .cols{gap:6px;min-height:0;padding-top:30px}.stk{padding:0;gap:4px}.b{height:20px;padding:0;border-radius:6px}.b span,.b svg{display:none}.b.e{height:28px}.b.e svg{display:block;font-size:14px}
 .tag{display:none}.b.a:after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px}
 .cap{display:none}.lab{text-align:center;padding-top:8px}.lab .nm{justify-content:center}.lab .nm span,.lab .s{display:none}.lab .nm i{font-size:11px}.col.sel .lab .nm i{color:var(--acc)}
 .here{font-size:10.5px;padding:3px 8px}.here span{display:none}.beam{bottom:30px}
 .mcap{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--ln2);position:relative}.mcap svg{font-size:24px;color:var(--acc);flex:none}.mcap b{display:block;font-size:14.5px}.mcap span{font-size:12.5px;color:var(--mu)}
 .rh{padding:14px 14px;gap:12px}.ri{width:38px;height:38px;font-size:21px}.rb{padding:0 14px 18px 14px}.mini{display:none}.tln .w{display:none}.tln small.m{display:block}
}
</style></head><body>
<div id="app"></div>
<script src="../ic.js"></script><script src="../m.js"></script>
<script>
let SEL=P.cur.i;
function blk(t){const c=t.d?'d':t.added?'a':t.now?'n':'t';const i=t.d?ic('r:check'):t.added?ic('r:plus'):t.now?ic('r:circle-notch'):'';
 return `<div class="b ${c}" title="${t.t}">${i}<span>${t.t}</span></div>`}
function sky(){
 return `<div class="skh"><h2>Your project, stage by stage</h2><div class="lgd"><span><i style="background:var(--acc)"></i>Done</span><span><i style="box-shadow:inset 0 0 0 2px var(--acc)"></i>Working on it</span><span><i style="background:var(--ams);box-shadow:inset 0 0 0 1.5px var(--am)"></i>Added later</span><span><i style="background:var(--ln2)"></i>Coming up</span></div></div>
 <div class="cols has">${P.stages.map(s=>`<div class="col ${s.st} ${s.i===SEL?'sel':''}" tabindex="0" onclick="pick(${s.i},1)" onkeydown="if(event.key==='Enter')pick(${s.i},1)">
  ${s.st==='now'?`<div class="beam"></div><div class="here">${ic('r:flag')}<span>We are here</span></div>`:''}
  <div class="cap">${s.st==='reopened'?`<span class="chip c-am">${ic('r:plus')} 1 added 14 Nov</span>`:s.st==='done'?`<span class="chip c-ok">${ic('r:check')} Done</span>`:s.you?`<span class="chip c-acc">${ic('r:user')} Your OK</span>`:''}</div>
  <div class="stk">${s.total?s.tasks.map(blk).join(''):`<div class="b e" title="Handover">${ic('r:flag')}</div>`}</div>
  <div class="base"></div><div class="lab"><div class="nm"><i>0${s.i+1}</i><span>${s.n}</span></div><div class="s">${s.st==='reopened'?'Done · 1 added':s.st==='now'?`${s.done} of ${s.total} · till ${s.to}`:s.st==='done'?'Done '+s.to:s.from+' – '+s.to}</div></div></div>`).join('')}</div>
 <div class="mcap" id="mcap"></div>`;
}
function mcap(){const s=P.stages[SEL];return `${ic('d:'+s.ic)}<div><b>0${s.i+1} · ${s.n}</b><span>${s.st==='reopened'?'Complete · 1 task added 14 Nov':s.total?`${s.done} of ${s.total} done`:'Final step'} · ${s.from} – ${s.to}</span></div>`}
function sub(s){
 if(s.st==='done')return `Completed ${s.to} · you approved it`;
 if(s.st==='reopened')return `Completed ${s.to} · 1 task added on 14 Nov`;
 if(s.st==='now')return `Started ${s.from} · aiming for ${s.to}`;
 if(s.st==='next')return `Planned ${s.from} – ${s.to} · needs your OK`;
 return s.total?`Planned ${s.from} – ${s.to}`:`Planned ${s.to} · final step`;
}
function rows(){
 return P.stages.map(s=>`<div class="row ${s.st} ${s.i===SEL||s.added?'open':''}" id="r${s.i}">
  <button class="rh" onclick="tog(${s.i})"><span class="ri">${ic('d:'+s.ic)}</span><span class="rt"><b>${s.n} ${s.st==='now'?'<span class="chip c-acc">In progress</span>':s.st==='reopened'?'<span class="chip c-am">+1 added later</span>':s.st==='next'?'<span class="chip c-mu">Up next</span>':''}</b><span>${sub(s)}</span></span>
  ${s.total?`<span class="mini">${s.tasks.map(t=>`<i class="${t.d?'d':t.added?'a':t.now?'n':''}"></i>`).join('')}</span>`:''}${ic('r:caret-down','cv')}</button>
  <div class="rb">${s.added?`<div class="why">${ic('d:info')}<div>You asked for a festive offers banner on 14 Nov. We added it to Design without touching the approved work. <b>Launch date stays the same.</b></div></div>`:''}
  ${s.total?`<ul class="tln">${s.tasks.map(t=>{const c=t.d?'d':t.added?'a':t.now?'n':'';const d=t.d?ic('d:check-circle','dot'):t.added?ic('d:plus-circle','dot'):t.now?ic('r:circle-notch','dot'):ic('r:circle','dot');
   const r=t.d?`Done ${t.d}`:t.added?`<span class="chip c-am">Added ${t.added}</span>`:t.now?'<span class="chip c-acc">Working on it</span>':t.you?'<span class="chip c-acc">Your turn</span>':'';
   const sm=t.added?`At your request · ready by ${t.eta}`:t.you?'We will send you a review link':'';const mm=t.d?`Done ${t.d}`:t.now&&!t.added?'Working on it':'';
   return `<li class="${c}">${d}<div><b>${t.t}</b>${sm?`<small>${sm}</small>`:''}${mm?`<small class="m">${mm}</small>`:''}</div><div class="w">${r}</div></li>`}).join('')}</ul>`:`<div class="note">${ic('d:handshake')} We hand over logins, files and a short guide. Details come closer to the date.</div>`}</div></div>`).join('');
}
function tog(i){document.getElementById('r'+i).classList.toggle('open')}
function pick(i,go){SEL=i;document.querySelectorAll('.col').forEach((e,j)=>e.classList.toggle('sel',j===i));document.getElementById('mcap').innerHTML=mcap();
 const r=document.getElementById('r'+i);r.classList.add('open');if(go&&innerWidth>720)r.scrollIntoView({behavior:'smooth',block:'start'})}
function paint(){}
document.getElementById('app').innerHTML=shell('2')+`<main class="w">
 <div class="hello"><div><h1>${P.name}</h1><p>Now building your pages. Next: Review, where you check everything.</p></div>
 <div class="kp"><div class="k"><b>${P.pct}%</b><span>${P.done} of ${P.total} tasks</span></div><div class="k"><b>${P.daysLeft} days</b><span>to launch, 28 Nov</span></div></div></div>
 <div id="payslot">${payCard()}</div>
 <div class="sky">${sky()}</div>
 <div class="h2"><h2>All stages</h2><span>Tap a stage to open it</span></div>
 <div class="ac">${rows()}</div>
 <div class="foot">Preview with sample data · Haritt Developers</div></main>`;
document.getElementById('mcap').innerHTML=mcap();
</script></body></html>
