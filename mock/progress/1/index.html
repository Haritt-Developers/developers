<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Progress preview 1 · Task ribbon</title>
<link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../m.css">
<style>
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:40px 0 24px}
.eb{font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.22em;color:var(--mu);text-transform:uppercase}
.hero h1{font-family:Montserrat,sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;margin:8px 0 6px;line-height:1.15}.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;color:var(--mu);font-size:15px;max-width:520px}
.big{text-align:right;flex:none}.big b{font-family:Montserrat,sans-serif;font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;display:block}.big b small{font-size:28px;color:var(--mu);font-weight:700}.big span{font-size:13.5px;color:var(--mu);display:inline-flex;gap:6px;align-items:center;margin-top:6px}
#payslot{margin-bottom:18px}
.rb{background:var(--card);border:1px solid var(--ln);border-radius:26px;padding:28px 28px 22px;box-shadow:var(--sh)}
.segs{display:flex;gap:14px;align-items:stretch}
.seg{min-width:0;display:flex;flex-direction:column;gap:10px;cursor:pointer;border-radius:14px;outline:none}
.sl{display:flex;flex-direction:column;gap:3px;min-height:44px}.sl .nm{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl .nm i{font-style:normal;font-family:Montserrat,sans-serif;font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.06em}
.sl .ss{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done .ss{color:var(--ok)}.seg.now .nm{color:var(--acc)}.seg.now .ss{color:var(--acc)}.seg.reopened .ss{color:var(--am)}
.cells{display:flex;gap:4px;height:46px}
.cell{flex:1;min-width:6px;border-radius:7px;background:var(--track);position:relative;transition:transform .2s}
.cells .cell:first-child{border-radius:12px 7px 7px 12px}.cells .cell:last-child{border-radius:7px 12px 12px 7px}.cells .cell:only-child{border-radius:12px}
.cell.d{background:linear-gradient(180deg,var(--acc2),var(--acc))}
.cell.n{background:repeating-linear-gradient(-45deg,var(--acc) 0 7px,var(--acc2) 7px 14px);background-size:200% 100%;animation:mv 2.4s linear infinite;box-shadow:0 0 0 3px var(--accs),0 6px 18px -4px rgba(232,70,31,.5)}
.cell.a{background:repeating-linear-gradient(-45deg,var(--hatch) 0 5px,transparent 5px 10px),var(--ams);box-shadow:inset 0 0 0 1.5px var(--am)}
.cell.a:before{content:"+";position:absolute;top:-9px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--am);color:#fff;font:700 13px/18px Inter,sans-serif;text-align:center}
[data-t=dark] .cell.a:before{color:#1a1206}
.cell.e{background:transparent;border:1.5px dashed var(--ln);display:grid;place-items:center;color:var(--mu);font-size:20px}
@keyframes mv{to{background-position:-28px 0}}
.cell[data-tip]:hover{transform:translateY(-2px)}
.cell[data-tip]:hover:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:9px;white-space:nowrap;z-index:5;pointer-events:none}
.today{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#fff;background:var(--ink);padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.today:before{content:"";position:absolute;top:-4px;left:50%;margin-left:-4px;border:4px solid transparent;border-top:0;border-bottom-color:var(--ink)}[data-t=dark] .today{color:var(--bg)}
.sd{font-size:12px;color:var(--mu);white-space:nowrap;min-height:18px}.seg.now .sd{visibility:hidden}
.seg:focus-visible .cells{outline:2px solid var(--acc);outline-offset:4px;border-radius:12px}
.lgd{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--ln2);font-size:12.5px;color:var(--mu)}.lgd span{display:flex;gap:7px;align-items:center}.lgd i{width:16px;height:10px;border-radius:3px;display:inline-block}
.mcap{display:none}.tl .tt small.m{display:none}
/* stage list */
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:44px 0 14px}.h2 h2{font-family:Montserrat,sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0}.h2 span{font-size:13px;color:var(--mu)}
.st{display:grid;grid-template-columns:270px 1fr;gap:28px;padding:26px 28px;background:var(--card);border:1px solid var(--ln);border-radius:22px;margin-bottom:12px;scroll-margin-top:20px;transition:box-shadow .3s}
.st.flash{box-shadow:0 0 0 3px var(--accs)}
.st.now{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--acc) 40%,var(--ln))}
.sh{display:flex;flex-direction:column;gap:8px}.sn{font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;color:var(--mu);letter-spacing:.1em}
.sh h3{margin:0;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}.sh h3 svg{font-size:28px;color:var(--acc)}.st.done .sh h3 svg,.st.reopened .sh h3 svg{color:var(--ok)}.st.later .sh h3 svg,.st.next .sh h3 svg{color:var(--mu)}
.sh .dt{font-size:13px;color:var(--mu);display:flex;gap:6px;align-items:center}.sh .chips{display:flex;gap:6px;flex-wrap:wrap}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--ln2)}.tl li:last-child{border-bottom:0}
.tl .ti{font-size:21px;margin-top:1px;color:var(--track)}.tl li.d .ti{color:var(--ok)}.tl li.n .ti{color:var(--acc)}.tl li.a .ti{color:var(--am)}.tl li.y .ti{color:var(--acc)}
.tl .tt{flex:1;min-width:0}.tl .tt b{font-weight:500;display:block}.tl li.d .tt b{color:var(--ink2)}.tl .tt small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.tl .tr{font-size:12.5px;color:var(--mu);white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.addbox{display:flex;gap:10px;background:var(--ams);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:6px}.addbox svg{font-size:20px;color:var(--am);margin-top:1px}
.empty{color:var(--mu);font-size:14px;display:flex;gap:10px;align-items:center;padding:8px 0}.empty svg{font-size:20px}
.more{border:0;background:none;color:var(--mu);font-size:13px;padding:6px 0;display:flex;gap:6px;align-items:center}.more svg{transition:transform .2s}.st.open .more svg{transform:rotate(180deg)}
.st.fold .tl{display:none}.st.fold.open .tl{display:block}
.foot{color:var(--mu);font-size:12.5px;text-align:center;padding:30px 0 60px}
@media (max-width:860px){.st{grid-template-columns:1fr;gap:14px;padding:20px}}
@media (max-width:720px){
 .hero{flex-direction:column;align-items:flex-start;gap:16px;padding:26px 0 18px}.hero h1{font-size:26px}.big{text-align:left;display:flex;align-items:baseline;gap:12px}.big b{font-size:48px}.big span{margin:0}
 .rb{padding:20px 16px 16px;border-radius:22px}.segs{gap:6px}.sl{min-height:0}.sl .ss,.sd,.sl .nm span{display:none}.sl .nm{justify-content:center}.sl .nm i{font-size:11px}
 .seg.sel .sl .nm i{color:var(--acc)}
 .cells{height:40px;gap:3px}.cell{min-width:4px}.today{display:none}
 .mcap{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--ln2)}.mcap svg{font-size:26px;color:var(--acc);flex:none}.mcap b{display:block;font-size:14.5px}.mcap span{font-size:12.5px;color:var(--mu)}
 .lgd{gap:10px 16px}.lgd span:last-child{display:none}.h2{margin-top:32px}.tl .tr{display:none}.tl .tt small.m{display:block}
}
</style></head><body>
<div id="app"></div>
<script src="../ic.js"></script><script src="../m.js"></script>
<script>
let SEL=P.cur.i;
function cellCls(t){return t.d?'d':t.added?'a':t.now?'n':''}
function ribbon(){
 return `<div class="segs">${P.stages.map(s=>`<div class="seg ${s.st} ${s.i===SEL?'sel':''}" tabindex="0" style="flex:${Math.max(s.total,2.2)} 1 0" onclick="pick(${s.i})" onkeydown="if(event.key==='Enter')pick(${s.i})">
  <div class="sl"><div class="nm"><i>0${s.i+1}</i><span>${s.n}</span></div><div class="ss">${s.st==='reopened'?'Done · +1 added':s.st==='now'?`${s.done} of ${s.total} done`:ST[s.st]}</div></div>
  <div class="cells">${s.total?s.tasks.map(t=>`<div class="cell ${cellCls(t)}" data-tip="${t.t}${t.d?' · done '+t.d:t.added?' · added '+t.added:t.now?' · in progress':''}">${t.now&&s.st==='now'?'<span class="today">Today</span>':''}</div>`).join(''):`<div class="cell e" data-tip="Handover · final step">${ic('r:flag')}</div>`}</div>
  <div class="sd">${s.from} – ${s.to}</div></div>`).join('')}</div>
  <div class="mcap" id="mcap"></div>
  <div class="lgd"><span><i style="background:linear-gradient(180deg,var(--acc2),var(--acc))"></i>Done</span><span><i style="background:repeating-linear-gradient(-45deg,var(--acc) 0 3px,var(--acc2) 3px 6px)"></i>Working on it</span><span><i style="background:var(--ams);box-shadow:inset 0 0 0 1.5px var(--am)"></i>Added later</span><span><i style="background:var(--track)"></i>Coming up</span><span style="margin-left:auto">Each block is one task. Hover or tap a stage.</span></div>`;
}
function mcap(){const s=P.stages[SEL];return `${ic('d:'+s.ic)}<div><b>0${s.i+1} · ${s.n}</b><span>${s.st==='reopened'?'Complete · 1 task added 14 Nov':s.total?`${s.done} of ${s.total} done`:'Final step'} · ${s.from} – ${s.to}</span></div>`}
function taskRow(t,s){
 const cls=t.d?'d':t.added?'a':t.you&&s.st!=='later'?'y':t.now?'n':'';
 const icn=t.d?ic('d:check-circle','ti'):t.added?ic('d:plus-circle','ti'):t.now?ic('r:circle-notch','ti'):ic('r:circle','ti');
 const right=t.d?`Done ${t.d}`:t.added?`<span class="chip c-am">Added ${t.added}</span><span>Ready by ${t.eta}</span>`:t.now?'<span class="chip c-acc">Working on it</span>':t.you?'<span class="chip c-acc">'+ic('r:user')+' Your turn</span>':'';
 const sub=t.added?'You asked for this on 14 Nov':t.you?'We will send you a review link':'';
 const msub=t.d?`Done ${t.d}`:t.added?`Added ${t.added} · ready by ${t.eta}`:t.now?'Working on it':'';
 return `<li class="${cls}">${icn}<div class="tt"><b>${t.t}</b>${sub?`<small>${sub}</small>`:''}${msub?`<small class="m">${msub}</small>`:''}</div><div class="tr">${right}</div></li>`;
}
function stages(){
 return P.stages.map(s=>{
  const chips=[];
  if(s.st==='done')chips.push(`<span class="chip c-ok">${ic('r:check')} Complete</span>`);
  if(s.st==='reopened')chips.push(`<span class="chip c-ok">${ic('r:check')} Completed 12 Nov</span>`,`<span class="chip c-am">${ic('r:plus')} 1 added later</span>`);
  if(s.st==='now')chips.push(`<span class="chip c-acc">${s.done} of ${s.total} done</span>`);
  if(s.st==='next')chips.push(`<span class="chip c-mu">Up next</span>`);
  if(s.st==='later')chips.push(`<span class="chip c-mu">Coming up</span>`);
  if(s.okBy)chips.push(`<span class="chip c-mu">${ic('r:thumbs-up')} You approved ${s.okBy}</span>`);
  if(s.you)chips.push(`<span class="chip c-acc">${ic('r:user')} Needs your OK</span>`);
  const fold=s.st==='done';
  const dt=s.st==='now'?`Started ${s.from} · aim ${s.to}`:s.st==='done'||s.st==='reopened'?`${s.from} – ${s.to}`:`Planned ${s.from} – ${s.to}`;
  return `<section class="st ${s.st} ${fold?'fold':''}" id="s${s.i}"><div class="sh"><span class="sn">STAGE 0${s.i+1}</span><h3>${ic('d:'+s.ic)}${s.n}</h3><span class="dt">${ic('r:calendar-blank')}${dt}</span><div class="chips">${chips.join('')}</div></div>
  <div>${s.added?`<div class="addbox">${ic('d:info')}<div>On 14 Nov you asked for a festive offers banner, so we added it to Design. Everything else in Design stays approved, and <b>your launch date does not change.</b></div></div>`:''}
  ${fold?`<button class="more" onclick="this.closest('.st').classList.toggle('open')">${s.total} tasks done ${ic('r:caret-down')}</button>`:''}
  ${s.total?`<ul class="tl">${s.tasks.map(t=>taskRow(t,s)).join('')}</ul>`:`<div class="empty">${ic('d:handshake')}We hand over logins, files and a short guide. Details come closer to the date.</div>`}</div></section>`}).join('');
}
function pick(i){SEL=i;document.querySelectorAll('.seg').forEach((e,j)=>e.classList.toggle('sel',j===i));document.getElementById('mcap').innerHTML=mcap();
 if(innerWidth>720){const el=document.getElementById('s'+i);el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200)}}
function paint(){}
document.getElementById('app').innerHTML=shell('1')+`<main class="w">
 <div class="hero"><div><div class="eb">Your project · ${P.name}</div><h1>We are <em>building</em> your site.</h1><p>${P.done} of ${P.total} tasks done. Next up is Review, where you check the full site before it goes live.</p></div>
 <div class="big"><b>${P.pct}<small>%</small></b><span>${ic('r:flag')}Launch ${P.launch} · ${P.daysLeft} days to go</span></div></div>
 <div id="payslot">${payCard()}</div>
 <div class="rb">${ribbon()}</div>
 <div class="h2"><h2>Stage by stage</h2><span>Updated today, ${TODAY}</span></div>
 ${stages()}
 <div class="foot">Preview with sample data · Haritt Developers</div></main>`;
document.getElementById('mcap').innerHTML=mcap();
</script></body></html>
