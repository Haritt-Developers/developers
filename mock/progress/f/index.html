<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Project Space · Home</title>
<link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../m.css"><link rel="stylesheet" href="f.css">
<style>
.ov{background:var(--card);border:1px solid var(--ln);border-radius:28px;box-shadow:var(--sh);overflow:hidden}
.og{display:grid;grid-template-columns:1.2fr 1fr}
.ol{padding:30px 32px 26px;display:flex;flex-direction:column;position:relative}
.ol:after{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;background:radial-gradient(circle,var(--accs),transparent 70%);pointer-events:none}
.ol>*{position:relative;z-index:1}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px}.pn{font-size:14px;color:var(--mu);font-weight:500}
.big{display:flex;align-items:baseline;gap:12px;margin:14px 0 22px;flex-wrap:wrap}.big b{font-family:Montserrat,sans-serif;font-size:72px;font-weight:800;letter-spacing:-.045em;line-height:.9}.big span{font-size:18px;font-weight:600;color:var(--ink2);max-width:200px;line-height:1.3}
.bar{display:flex;gap:4px;cursor:pointer}.bs{min-width:0}
.bt{height:10px;border-radius:10px;background:var(--track);overflow:hidden}.bt i{display:block;height:100%;border-radius:10px;background:var(--dn)}.bs.now .bt i{background:var(--acc)}
.bl{margin-top:9px;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bs.done .bl{color:var(--dn)}.bs.now .bl{color:var(--acc);font-weight:700}
.step{display:none;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--acc)}
.see{margin-top:auto;padding-top:24px;display:flex}.see a{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;color:var(--acc);text-decoration:none;padding:10px 16px;border-radius:12px;background:var(--accs)}.see a svg{font-size:16px;transition:transform .2s}.see a:hover svg{transform:translateX(3px)}
.or{background:var(--ln2);padding:18px 28px;display:flex;flex-direction:column;justify-content:center}
[data-t=dark] .or{background:#1E1F23}
.obot{border-top:1px solid var(--ln);padding:14px 28px}
@media (max-width:820px){
 .og{grid-template-columns:1fr}.ol{padding:22px 18px 18px}.big b{font-size:56px}.big span{font-size:16px}.big{margin:10px 0 16px}
 .bl{display:none}.step{display:block}.bar{gap:3px}.bt{height:8px}.see{padding-top:16px}.see a{width:100%;justify-content:center}
 .or{padding:6px 18px}.obot{padding:14px 18px}.help{flex-wrap:wrap}.hb{width:100%}.hb .btn{flex:1;justify-content:center}
}
</style></head><body>
<div id="app"></div>
<script src="../ic.js"></script><script src="../m.js"></script><script src="d.js"></script>
<script>
window.OPTS=[['f','Home',1],['f/details','Full progress',1]];
function ov(){const t=T[L];return `<div class="ov"><div class="og"><div class="ol"><div class="oh"><span class="pn">${P.name}</span>${langSw()}</div>
 <div class="big"><b>${PCT}%</b><span>${t.ready}</span></div>
 <div class="bar" onclick="location.href='details/'">${S.map(s=>`<div class="bs ${isDone(s)?'done':s.st==='now'?'now':''}" style="flex:1 1 0"><div class="bt"><i style="width:${fr(s)*100}%"></i></div><div class="bl">${s[L][0]}</div></div>`).join('')}</div>
 <div class="step">${t.step(CUR.i+1,S.length,CUR[L][0])}</div>
 <div class="see"><a href="details/">${t.see} ${ic('r:arrow-right')}</a></div></div>
 <div class="or"><div class="facts"><div class="f now"><span class="fi">${ic('d:'+CUR.ic)}</span><div><small>${t.now}</small><b>${CUR[L][1]}</b></div></div>
 <div class="f"><span class="fi">${ic('d:calendar-dots')}</span><div><small>${t.launch}</small><b>${D(P.launch)} · ${t.days(P.daysLeft)}</b></div></div>
 ${PAY==='due'?`<div class="f act"><span class="fi">${ic('d:currency-inr')}</span><div><small>${t.you}</small><b>${t.pay}</b></div></div>`:`<div class="f ok"><span class="fi">${ic('d:thumbs-up')}</span><div><small>${t.you}</small><b>${t.nothing}</b></div></div>`}</div></div></div>
 <div class="obot"><div class="help">${ic('d:question')}<div class="ht"><b>${t.help}</b><span>${t.helps}</span></div><div class="hb"><button class="btn wa">${ic('d:whatsapp-logo')}${t.wa}</button><button class="btn gh">${ic('d:chat-circle-text')}${t.msg}</button></div></div></div></div>`}
function render(){document.documentElement.lang=L;document.getElementById('main').innerHTML=`<div id="payslot">${payCard()}</div>${ov()}<div class="foot">Home preview · other Home sections stay as they are · sample data</div>`}
document.getElementById('app').innerHTML=shell('f')+`<main class="w" id="main"></main>`;render();
</script></body></html>
