<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Progress preview A · Spotlight</title>
<link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../m.css"><link rel="stylesheet" href="../r.css">
<style>
.card{background:var(--card);border:1px solid var(--ln);border-radius:28px;box-shadow:var(--sh);padding:30px 30px 24px;margin-top:0}
.ct{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.eb{font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.22em;color:var(--acc);text-transform:uppercase}
.ct h1{font-family:Montserrat,sans-serif;font-size:30px;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.15}.ct p{margin:0;color:var(--mu)}
.ov{text-align:right;flex:none}.ov b{font-family:Montserrat,sans-serif;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}.ov b small{font-size:18px;color:var(--mu)}.ov span{display:block;font-size:13px;color:var(--mu)}
.segs{display:flex;gap:10px;align-items:flex-end}
.seg{flex:var(--f) 1 0;min-width:0;display:flex;flex-direction:column;gap:10px;position:relative;padding:0 2px}
.sh{display:flex;gap:8px;align-items:center;min-width:0}
.si{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;background:var(--ln2);color:var(--mu)}
.seg.done .si,.seg.reopened .si{background:var(--dn);color:#fff}
.sn{min-width:0;display:flex;flex-direction:column;line-height:1.2}.sn b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sn span{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done .sn span,.seg.reopened .sn span{color:var(--dn)}.seg.reopened .sn span em{color:var(--am);font-style:normal}
.seg .cells{height:30px}.seg .cell{font-size:13px}
.sd{font-size:11.5px;color:var(--mu);white-space:nowrap}
.seg.later,.seg.next{opacity:.8}
.seg.on{background:var(--accs);border-radius:20px;padding:14px 14px 12px;box-shadow:inset 0 0 0 1.5px var(--acc)}
.seg.on .cells{height:46px}.seg.on .si{background:var(--acc);color:#fff;width:34px;height:34px;font-size:19px}.seg.on .sn b{font-size:17px;color:var(--acc)}.seg.on .sn span{color:var(--ink);font-weight:500}
.seg.on .sd{color:var(--ink2)}
.here{position:absolute;top:-12px;left:14px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:3px 10px;border-radius:99px;display:flex;gap:5px;align-items:center}
.here svg{font-size:12px}
.call{position:relative;margin-top:22px;background:var(--ln2);border-radius:20px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.call:before{content:"";position:absolute;top:-9px;left:var(--px,50%);width:18px;height:18px;background:var(--ln2);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.cb{display:flex;gap:12px;align-items:flex-start;position:relative}.cb>svg{font-size:30px;flex:none;color:var(--acc)}.cb:nth-child(2)>svg{color:var(--ink2)}.cb:nth-child(3)>svg{color:var(--dn)}
.cb small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.cb b{display:block;font-size:15px;margin:2px 0}.cb span{font-size:13px;color:var(--mu)}
.key{margin-top:18px}.ml{display:none}
@media (max-width:720px){
 .card{padding:20px 14px 16px;border-radius:22px}.ct{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:26px}.ct h1{font-size:24px}.ov{text-align:left;display:flex;gap:10px;align-items:baseline}.ov b{font-size:32px}
 .segs{gap:4px;align-items:flex-start}.seg,.seg.on{flex:var(--fm) 1 0;padding:0;background:none;box-shadow:none;gap:8px}.seg .sh,.seg .sd,.here{display:none}
 .seg .cells,.seg.on .cells{height:12px;gap:2px}.seg .cell{border-radius:3px!important}.seg .cells .cell:first-child{border-radius:6px 3px 3px 6px!important}.seg .cells .cell:last-child{border-radius:3px 6px 6px 3px!important}.seg .cell svg{display:none}
 .seg.on .cells{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--acc);border-radius:6px}
 .ml{display:flex;justify-content:center;font-size:12px;font-weight:700;color:var(--mu)}.seg.done .ml,.seg.reopened .ml{color:var(--dn);font-size:15px}.seg.on .ml{color:var(--acc);font-size:13px;margin-top:2px}
 .seg.reopened .ml:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--am);margin:2px 0 0 2px}
 .call{margin-top:18px}.cb>svg{font-size:24px}.cb b{font-size:14.5px}.key{font-size:12px;gap:8px 14px}.key span:last-child{display:none}
 .call{grid-template-columns:1fr;gap:14px;padding:16px}
}
</style></head><body>
<div id="app"></div>
<script src="../ic.js"></script><script src="../m.js"></script><script src="../r.js"></script>
<script>
const hero=`<div id="payslot">${payCard()}</div><div class="card"><div class="ct"><div><div class="eb">Stage ${P.cur.i+1} of ${P.stages.length} · ${P.name}</div><h1>We are building your site.</h1><p>${P.cur.done} of ${P.cur.total} build tasks done. We aim to finish by ${P.cur.to}.</p></div>
 <div class="ov"><b>${P.pct}<small>%</small></b><span>of the project done · launch ${P.launch}</span></div></div>
 <div class="segs">${P.stages.map(s=>{const on=s.st==='now';const fl=on?Math.max(s.total,1)*1.9:(s.total?Math.max(s.total,2.3):3);
  return `<div class="seg ${s.st} ${on?'on':''}" style="--f:${fl};--fm:${on?Math.max(s.total,1)*1.7:Math.max(s.total,1.4)}">${on?`<span class="here">${ic('r:flag')} YOU ARE HERE</span>`:''}
  <div class="sh"><span class="si">${s.st==='done'||s.st==='reopened'?ic('r:check'):on?ic('d:'+s.ic):s.i+1}</span><span class="sn"><b>${s.n}</b><span>${s.st==='reopened'?'Done <em>· +1 new</em>':on?`${s.done} of ${s.total} done`:word(s)}</span></span></div>
  ${cells(s,{icons:1})}<div class="ml">${s.st==='done'||s.st==='reopened'?ic('r:check'):on?s.n:s.i+1}</div><div class="sd">${s.st==='done'||s.st==='reopened'?'Finished '+s.to:on?`${s.from} – ${s.to}`:'From '+s.from}</div></div>`}).join('')}</div>
 <div class="call" id="call">
  <div class="cb">${ic('d:hourglass-medium')}<div><small>Happening now</small><b>${NOWT.t}</b><span>Then: speed and security checks</span></div></div>
  <div class="cb">${ic('d:'+NEXT.ic)}<div><small>Coming next</small><b>${NEXT.n}, from ${NEXT.from}</b><span>You check the full site and share changes</span></div></div>
  <div class="cb">${ic('d:thumbs-up')}<div><small>Needed from you</small><b>Nothing right now</b><span>We will message you when it is your turn</span></div></div>
 </div>
 <div class="key"><span><i class="k-d"></i>Done</span><span><i class="k-n"></i>Working on it</span><span><i class="k-a"></i>Added later</span><span><i class="k-t"></i>Not started</span><span>· Each small bar is one task</span></div></div>`;
page('a',hero);
function point(){const c=document.getElementById('call'),o=document.querySelector('.seg.on');if(!c||!o)return;const r=c.getBoundingClientRect(),q=o.getBoundingClientRect();c.style.setProperty('--px',(q.left+q.width/2-r.left)+'px')}
point();addEventListener('resize',point);
</script></body></html>
